<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">GLBP · Gateway and forwarder roles</title>
<desc id="desc">Three GLBP routers have independent OSPF process 30 paths to CORE-R1. All share client network 10.30.30.0/24 and virtual gateway 10.30.30.1. After preferred AVG placement, R1 is AVG and AVF1, R2 is Standby AVG and AVF2, and R3 is Listen and AVF3. Initial host assignments correspond to AVF1, AVF2, and AVF3. Access-switch wiring is abstracted.</desc>
<style>
svg {background:#061e32;font-family:Arial,Helvetica,sans-serif}
.bg {fill:#061e32} .card {fill:#102d43;stroke:#527084;stroke-width:1.5}
text {fill:#f3f7fa} .heading {font-size:31px;font-weight:700}
.subtitle {font-size:20px;fill:#b9cfdf} .device {font-size:24px;font-weight:700}
.label {font-size:19px} .small {font-size:17px;fill:#c0d3df}
.line-label {font-size:18px;fill:#c0d3df;paint-order:stroke;stroke:#061e32;stroke-width:8px;stroke-linejoin:round}
.cyan {stroke:#63ceda} .gold {stroke:#e5bb6d} .muted {stroke:#86a6be}
.link {fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.card .cyan {stroke-width:3} .foot {fill:#0c273c;stroke:#456276;stroke-width:1}
</style>
