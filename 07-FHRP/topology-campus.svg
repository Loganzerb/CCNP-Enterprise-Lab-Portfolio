<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">FHRP campus · HSRP and VRRP</title>
<desc id="desc">CORE-R1 connects through OSPF process 10 to DIST-A and DIST-B. The distribution devices share a LACP EtherChannel and redundant trunks to ACCESS1. PC-A is in VLAN 10 and PC-B in VLAN 20. Healthy HSRP prefers DIST-A for VLAN 10 and DIST-B for VLAN 20; later VRRP reuses VLAN 20.</desc>
