text {fill:#f3f7fa} .heading {font-size:31px;font-weight:700}
.subtitle {font-size:20px;fill:#b9cfdf} .device {font-size:24px;font-weight:700}
.label {font-size:19px} .small {font-size:17px;fill:#c0d3df}
.line-label {font-size:18px;fill:#c0d3df;paint-order:stroke;stroke:#061e32;stroke-width:8px;stroke-linejoin:round}
.cyan {stroke:#63ceda} .gold {stroke:#e5bb6d} .muted {stroke:#86a6be}
.link {fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.card .cyan {stroke-width:3} .foot {fill:#0c273c;stroke:#456276;stroke-width:1}
</style>
