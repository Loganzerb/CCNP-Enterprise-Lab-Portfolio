</style><rect class="bg" width="1600" height="1100"/><text x="48" y="59" class="heading">08 / NAT and PAT</text><text x="48" y="94" class="subtitle">Shared inside LAN, translation boundary and routed outside network</text><rect x="48" y="415" width="820" height="515" rx="16" class="region"/><polyline points="410,245 610,245" class="link gold"/><polyline points="955,245 1170,245" class="link gold"/><polyline points="237,360 237,395 485,395 485,505 357,505 357,525" class="link cyan"/><polyline points="275,660 232,735" class="link cyan"/><polyline points="460,660 667,735" class="link cyan"/><rect x="65" y="165" width="345" height="195" rx="12" class="card"/><path d="M83 166H392" class="accent cyan"/><rect x="610" y="165" width="345" height="195" rx="12" class="card"/><path d="M628 166H937" class="accent gold"/><rect x="1170" y="165" width="365" height="195" rx="12" class="card"/><path d="M1188 166H1517" class="accent gold"/><rect x="185" y="525" width="345" height="135" rx="12" class="card"/><path d="M203 526H512" class="accent cyan"/><rect x="65" y="735" width="335" height="160" rx="12" class="card"/><path d="M83 736H382" class="accent cyan"/><rect x="500" y="735" width="335" height="160" rx="12" class="card"/><path d="M518 736H817" class="accent cyan"/><rect x="920" y="440" width="625" height="155" rx="10" class="note"/><rect x="920" y="615" width="625" height="130" rx="10" class="note"/><rect x="920" y="765" width="625" height="155" rx="10" class="note"/><rect x="48" y="989" width="1504" height="86" rx="8" class="note"/><text x="73" y="453" class="region-title" text-anchor="start">INSIDE / VLAN 10</text><text x="73" y="482" class="small" text-anchor="start" style="font-size:22px">10.10.10.0/24; client gateway 10.10.10.1</text><text x="237.5" y="201" class="device" text-anchor="middle" style="font-size:28px">NAT-EDGE</text><text x="237.5" y="231" class="label" text-anchor="middle" style="font-size:22px">Gi0/1 inside: 10.10.10.1/24</text><text x="237.5" y="258" class=