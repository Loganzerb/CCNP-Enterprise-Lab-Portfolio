<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">08 / NAT and PAT</title><desc id="desc">Six-device NAT lab. CLIENT-A and CLIENT-B connect through NAT-SW VLAN 10 to NAT-EDGE Gi0/1. NAT-EDGE Gi0/0 connects to ISP Gi0/0; ISP Gi0/1 connects to OUTSIDE-SRV Gi0/0. Separate callouts distinguish repaired dynamic NAT from final interface PAT and the guided alternatives.</desc><style>
