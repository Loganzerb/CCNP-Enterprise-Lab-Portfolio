" text-anchor="middle" style="font-size:22px">VLAN 10 on all three lab links</text><text x="255" y="382" class="port" text-anchor="start" style="font-size:22px">NAT-EDGE Gi0/1</text><text x="337" y="515" class="port" text-anchor="end" style="font-size:22px">NAT-SW Gi0/2</text><text x="232.5" y="771" class="device" text-anchor="middle" style="font-size:28px">CLIENT-A</text><text x="232.5" y="801" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.10.10.10/24</text><text x="232.5" y="828" class="label" text-anchor="middle" style="font-size:22px">Gateway 10.10.10.1</text><text x="667.5" y="771" class="device" text-anchor="middle" style="font-size:28px">CLIENT-B</text><text x="667.5" y="801" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.10.10.20/24</text><text x="667.5" y="828" class="label" text-anchor="middle" style="font-size:22px">Guided extra: 10.10.10.30/24</text><text x="667.5" y="855" class="label" text-anchor="middle" style="font-size:22px">Gateway 10.10.10.1</text><rect x="88.72" y="672" width="111.28" height="32" rx="3" fill="#061e32"/><text x="200" y="697" class="port" text-anchor="end" style="font-size:22px">SW Gi0/0</text><rect x="37.079999999999984" y="698" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="195" y="723" class="port" text-anchor="end" style="font-size:22px">Client Gi0/0</text><rect x="559.36" y="655" width="111.28" height="32" rx="3" fill="#061e32"/><text x="615" y="680" class="port" text-anchor="middle" style="font-size:22px">SW Gi0/1</text><rect x="687" y="696" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="687" y="721" class="port" text-anchor="start" style="font-size:22px">Client Gi0/0</text><text x="942" y="474" class="note-heading" text-anchor="start" style="font-size:22px">INCIDENT 01 / repaired dynamic NAT</text><text x="942" y="504" class="small" text-anchor="start" style="font-size:22px">Separate global address per inside identity</text><text x="942" y="531" class="small" text-anchor="start" style="font-size:22px">Pool: 192.0.2.10–192.0.2.11; no overload</text><text x="942" y="558" class="small" text-anchor="start" style="font-size:22px">ISP: 192.0.2.0/24 via 198.51.100.2</text><text x="942" y="649" class="note-heading" text-anchor="start" style="font-size:22px">INCIDENT 02 / final interface PAT</text><text x="942" y="679" class="small" text-anchor="start" style="font-size:22px">Both clients share Gi0/0: 198.51.100.2</text><text x="942" y="706" class="small" text-anchor="start" style="font-size:22px">These final modes are separate configuration snapshots.</text><text x="942" y="799" class="note-heading" text-anchor="start" style="font-size:22px">GUIDED ALTERNATIVES / separate lab stages</text><text x="942" y="829" class="small" text-anchor="start" style="font-size:22px">Static: 10.10.10.10 ↔ 198.51.100.10</text><text x="942" y="856" class="small" text-anchor="start" style="font-size:22px">ISP static-global /32 via 198.51.100.2</text><text x="942" y="883" class="small" text-anchor="start" style="font-size:22px">Pool PAT: 192.0.2.10–192.0.2.11 with overload</text><text x="70" y="1021" class="small" text-anchor="start" style="font-size:22px">Physical wiring follows both original fault exports. Final configs reconstruct the recorded repairs.</text><text x="70" y="1049" class="small" text-anchor="start" style="font-size:22px">Retained endpoint captures prove the tested NAT/PAT exchanges; mode callouts are separate checkpoints.</text></svg>