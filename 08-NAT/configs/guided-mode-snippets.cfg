! Reference snippets for the completed guided modes; not a combined configuration.
! Apply only one mode in its intended lab stage. These are reconstructed command summaries.
! Common NAT-EDGE roles and routing:
interface GigabitEthernet0/1
 ip nat inside
interface GigabitEthernet0/0
 ip nat outside
ip route 0.0.0.0 0.0.0.0 198.51.100.1
ip access-list standard NAT-SOURCES
 permit 10.10.10.0 0.0.0.255
!
! MODE 1 - static NAT, NAT-EDGE:
ip nat inside source static 10.10.10.10 198.51.100.10
! Corresponding ISP route:
ip route 198.51.100.10 255.255.255.255 198.51.100.2
!
! MODE 2 - dynamic one-to-one NAT, NAT-EDGE:
ip nat pool DYNAMIC-NAT 192.0.2.10 192.0.2.11 netmask 255.255.255.0
ip nat inside source list NAT-SOURCES pool DYNAMIC-NAT
! Corresponding ISP route:
ip route 192.0.2.0 255.255.255.0 198.51.100.2
!
! MODE 3 - interface PAT, NAT-EDGE:
ip nat inside source list NAT-SOURCES interface GigabitEthernet0/0 overload
!
! MODE 4 - pool PAT, NAT-EDGE:
ip nat pool PAT-POOL 192.0.2.10 192.0.2.11 netmask 255.255.255.0
ip nat inside source list NAT-SOURCES pool PAT-POOL overload
! Corresponding ISP route:
ip route 192.0.2.0 255.255.255.0 198.51.100.2
