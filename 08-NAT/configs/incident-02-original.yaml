lab:
  description: Incident 02 - External access after PAT migration
  notes: |
    Incident 02 - External access after PAT migration

    A change was intended to let inside users share NAT-EDGE's existing outside-interface address using PAT. CLIENT-A (10.10.10.10) and CLIENT-B (10.10.10.20) now report failed access to OUTSIDE-SRV (203.0.113.10). The handover says a connectivity check originated on NAT-EDGE succeeded, but user service has not been restored.

    Import this file as a separate lab. Investigate from the device consoles and preserve the existing devices, links, interface addresses, masks, and client gateways.

    Success criteria:
    - Both clients reach 203.0.113.10 reliably, individually and during overlapping traffic. After initial ARP convergence, demonstrate at least 20 successful ICMP echoes from each client while their tests overlap; repeat the test with the other client starting first.
    - Both clients use PAT through the existing outside-interface address, 198.51.100.2. Capture concurrent extended translations for both inside-local addresses and NAT statistics during the test.
    - Connectivity remains stable without repeatedly clearing translations or reloading devices.
    - Record the initial symptoms, evidence for each diagnosis, repairs, and final verification. Save the repaired device configurations.

    Validation: YAML parsing, link/interface consistency, addressing preservation, and configuration coherence were checked offline. This file has not been boot-tested in CML.
  timestamp: 1789167180.319
  title: CCNP_MASTERCLASS_Incident_02
  version: 0.0.4
