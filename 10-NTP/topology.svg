</style><rect class="bg" width="1600" height="1080"/><text x="48" y="59" class="heading">10 / NTP hierarchy and recovery</text><text x="48" y="94" class="subtitle">Physical wiring stays fixed while time-source and return-route state change</text><polyline points="415,265 1135,265" class="link cyan"/><polyline points="1195,380 985,485" class="link cyan"/><polyline points="450,758 660,600" class="link cyan"/><polyline points="1135,758 935,600" class="link gold"/><rect x="65" y="180" width="350" height="175" rx="12" class="card"/><path d="M83 181H397" class="accent cyan"/><rect x="1135" y="180" width="400" height="200" rx="12" class="card"/><path d="M1153 181H1517" class="accent cyan"/><rect x="615" y="440" width="370" height="160" rx="12" class="card"/><path d="M633 441H967" class="accent cyan"/><rect x="65" y="700" width="385" height="185" rx="12" class="card"/><path d="M83 701H432" class="accent cyan"/><rect x="1135" y="700" width="400" height="185" rx="12" class="card"/><path d="M1153 701H1517" class="accent gold"/><rect x="535" y="700" width="520" height="185" rx="10" class="note"/><rect x="48" y="941" width="1504" height="114" rx="8" class="note"/><text x="240.0" y="216" class="device" text-anchor="middle" style="font-size:28px">R1-NTP-SOURCE-A</text><text x="240.0" y="246" class="label" text-anchor="middle" style="font-size:22px">Local clock: ntp master 1</text><text x="240.0" y="273" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.12.0.1/30</text><text x="240.0" y="300" class="label" text-anchor="middle" style="font-size:22px">Route 10.20.0.0/24 via R2</text><text x="1335.0" y="216" class="device" text-anchor="middle" style="font-size:28px">R2-NTP-CORE</text><text x="1335.0" y="246" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.12.0.2/30</text><text x="1335.0" y="273" class="label" text-anchor="middle" style="font-size:22px">Gi0/1: 10.20.0.1/24</text><text x="1335.0" y="300" class="label" text-anchor="middle" style="font-size:22px">Servers: 10.12.0.1 and 10.20.0.4</text><text x="1335.0" y="327" class="label" text-anchor="middle" style="font-size:22px">Distributes time to R3</text><text x="800.0" y="476" class="device" text-anchor="middle" style="font-size:28px">SW1-NTP-ACCESS</text><text x="800.0" y="506" class="label" text-anchor="middle" style="font-size:22px">Layer 2 access switch / VLAN 1</text><text x="800.0" y="533" class="label" text-anchor="middle" style="font-size:22px">Shared LAN: 10.20.0.0/24</text><text x="800.0" y="560" class="label" text-anchor="middle" style="font-size:22px">Gi0/3 unused and shut down</text><text x="257.5" y="736" class="device" text-anchor="middle" style="font-size:28px">R3-NTP-CLIENT</text><text x="257.5" y="766" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.20.0.3/24</text><text x="257.5" y="793" class="label" text-anchor="middle" style="font-size:22px">Only NTP server: 10.20.0.1</text><text x="257.5" y="820" class="label" text-anchor="middle" style="font-size:22px">Default via 10.20.0.1</text><text x="257.5" y="847" class="label" text-anchor="middle" style="font-size:22px">Later Lo0: 3.3.3.3/32</text><text x="1335.0" y="736" class="device" text-anchor="middle" style="font-size:28px">R4-NTP-SOURCE-B</text><text x="1335.0" y="766" class="label" text-anchor="middle" style="font-size:22px">Local clock: ntp master 3</text><text x="1335.0" y="793" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.20.0.4/24</text><text x="1335.0" y="820" class="label" text-anchor="middle" style="font-size:22px">Default via 10.20.0.1</text><rect x="696.04" y="210" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="775" y="235" class="port" text-anchor="middle" style="font-size:22px">10.12.0.0/30</text><text x="435" y="296" class="port" text-anchor="start" style="font-size:22px">Gi0/0</text><text x="1115" y="296" class="port" text-anchor="end" style="font-size:22px">Gi0/0</text><rect x="1170" y="395" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1170" y="420" class="port" text-anchor="start" style="font-size:22px">R2 Gi0/1</text><rect x="1060" y="477" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1060" y="502" class="port" text-anchor="start" style="font-size:22px">SW Gi0/0</text><rect x="326.72" y="657" width="111.28" height="32" rx="3" fill="#061e32"/><text x="438" y="682" class="port" text-anchor="end" style="font-size:22px">R3 Gi0/0</text><rect x="632" y="618" width="111.28" height="32" rx="3" fill="#061e32"/><text x="632" y="643" class="port" text-anchor="start" style="font-size:22px">SW Gi0/1</text><rect x="1155" y="657" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1155" y="682" class="port" text-anchor="start" style="font-size:22px">R4 Gi0/0</text><rect x="836.72" y="618" width="111.28" height="32" rx="3" fill="#061e32"/><text x="948" y="643" class="port" text-anchor="end" style="font-size:22px">SW Gi0/2</text><text x="557" y="734" class="note-heading" text-anchor="start" style="font-size:22px">LATER SOURCE-ADDRESS EXERCISE</text><text x="557" y="764" class="small" text-anchor="start" style="font-size:22px">R3 sources NTP from Loopback0 3.3.3.3/32.</text><text x="557" y="791" class="small" text-anchor="start" style="font-size:22px">R2 return route: 3.3.3.3/32 via 10.20.0.3</text><text x="557" y="818" class="small" text-anchor="start" style="font-size:22px">Temporary UDP/123 filter: R2 Gi0/1 inbound</text><text x="557" y="845" class="small" text-anchor="start" style="font-size:22px">Cleanup retains Lo0 and /32; filter removed.</text><text x="70" y="973" class="small" text-anchor="start" style="font-size:22px">Recorded timing paths: initial R1 → R2 → R3 (strata 1 → 2 → 3); backup R4 → R2 → R3 (3 → 4 → 5).</text><text x="70" y="1001" class="small" text-anchor="start" style="font-size:22px">Timing arrows are relationships, not cables. SW1 is not an NTP participant. Both sources use local lab clocks.</text><text x="70" y="1029" class="small" text-anchor="start" style="font-size:22px">Export predates loopback/ACL stages; final post-ACL clock-status capture was not retained.</text></svg>