<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">10 / NTP hierarchy and recovery</title><desc id="desc">R1 connects directly to R2. R2, R3 and R4 share VLAN 1 through SW1. R1 is a local stratum-1 source and R4 is a local stratum-3 source. R2 has both configured; R3 uses only R2. R3 Loopback0 and R2 return route were later additions.</desc><style>
