<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">11 / Policy-based routing</title><desc id="desc">Five routers in OSPF area 0. R1 connects to R2; R2 connects to R3 and R4; R3 connects to R4; R4 connects to R5. R2 ingress Gi0/0 applies PBR. Source A 10.1.1.1 follows the R3 branch; source B 10.11.11.11 follows the normal R4 route. Destination R5 Loopback0 is configured /24 but learned in OSPF as a /32.</desc><style>
