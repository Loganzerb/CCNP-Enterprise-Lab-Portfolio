 class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.12.1.1/24</text><text x="232.5" y="498" class="label" text-anchor="middle" style="font-size:22px">Lo0: 10.1.1.1/24 / source A</text><text x="232.5" y="525" class="label" text-anchor="middle" style="font-size:22px">Lo1: 10.11.11.11/24 / source B</text><text x="740.0" y="441" class="device" text-anchor="middle" style="font-size:28px">R2-PBR-POLICY</text><text x="740.0" y="471" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.12.1.2/24 / ingress</text><text x="740.0" y="498" class="label" text-anchor="middle" style="font-size:22px">Gi0/1: 10.23.1.2/24</text><text x="740.0" y="525" class="label" text-anchor="middle" style="font-size:22px">Gi0/2: 10.24.1.2/24</text><text x="740.0" y="552" class="label" text-anchor="middle" style="font-size:22px">PBR on Gi0/0</text><text x="1122.5" y="191" class="device" text-anchor="middle" style="font-size:28px">R3-PBR-ALT</text><text x="1122.5" y="221" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.23.1.3/24</text><text x="1122.5" y="248" class="label" text-anchor="middle" style="font-size:22px">Gi0/1: 10.34.1.3/24</text><text x="1122.5" y="756" class="device" text-anchor="middle" style="font-size:28px">R4-PBR-PRIMARY</text><text x="1122.5" y="786" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.24.1.4/24</text><text x="1122.5" y="813" class="label" text-anchor="middle" style="font-size:22px">Gi0/1: 10.34.1.4/24</text><text x="1122.5" y="840" class="label" text-anchor="middle" style="font-size:22px">Gi0/2: 10.45.1.4/24</text><text x="1442.5" y="441" class="device" text-anchor="middle" style="font-size:28px">R5-PBR-DEST</text><text x="1442.5" y="471" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.45.1.5/24</text><text x="1442.5" y="498" class="label" text-anchor="middle" style="font-size:22px">Lo0: 10.5.5.5/24</text><text x="1442.5" y="525" class="label" text-anchor="middle" style="font-size:22px">Test destination</text><rect x="408.03999999999996" y="443" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="487" y="468" class="port" text-anchor="middle" style="font-size:22px">10.12.1.0/24</text><text x="417" y="538" class="port" text-anchor="start" style="font-size:22px">Gi0/0</text><text x="558" y="538" class="port" text-anchor="end" style="font-size:22px">Gi0/0</text><rect x="727.0799999999999" y="335" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="885" y="360" class="port" text-anchor="end" style="font-size:22px">10.23.1.0/24</text><rect x="965" y="378" width="111.28" height="32" rx="3" fill="#061e32"/><text x="965" y="403" class="port" text-anchor="start" style="font-size:22px">R2 Gi0/1</text><rect x="966" y="330" width="111.28" height="32" rx="3" fill="#061e32"/><text x="966" y="355" class="port" text-anchor="start" style="font-size:22px">R3 Gi0/0</text><rect x="727.0799999999999" y="655" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="885" y="680" class="port" text-anchor="end" style="font-size:22px">10.24.1.0/24</text><rect x="965" y="642" width="111.28" height="32" rx="3" fill="#061e32"/><text x="965" y="667" class="port" text-anchor="start" style="font-size:22px">R2 Gi0/2</text><rect x="965" y="680" width="111.28" height="32" rx="3" fill="#061e32"/><text x="965" y="705" class="port" text-anchor="start" style="font-size:22px">R4 Gi0/0</text><rect x="1145" y="343" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1145" y="368" class="port" text-anchor="start" style="font-size:22px">R3 Gi0/1</text><rect x="1145" y="629" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1145" y="654" class="port" text-anchor="start" style="font-size:22px">R4 Gi0/1</text><rect x="1145" y="500" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="1145" y="525" class="port" text-anchor="start" style="font-size:22px">10.34.1.0/24</text><rect x="1308.04" y="829" width="157.92000000000002" height="32" rx="3" fill="#061e32"/><text x="1387" y="854" class="port" text-anchor="middle" style="font-size:22px">10.45.1.0/24</text><rect x="1280" y="755" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1280" y="780" class="port" text-anchor="start" style="font-size:22px">R4 Gi0/2</text><rect x="1462" y="663" width="111.28" height="32" rx="3" fill="#061e32"/><text x="1462" y="688" class="port" text-anchor="start" style="font-size:22px">R5 Gi0/0</text><text x="87" y="724" class="note-heading" text-anchor="start" style="font-size:22px">POLICY LOOKUP / R2 Gi0/0 ingress</text><text x="87" y="754" class="small" text-anchor="start" style="font-size:22px">Match source 10.1.1.0/24 → set next hop 10.23.1.3.</text><text x="87" y="781" class="small" text-anchor="start" style="font-size:22px">Other baseline traffic follows the destination route via R4.</text><text x="87" y="808" class="small" text-anchor="start" style="font-size:22px">R1 creates the probes; they reach R2 as transit traffic.</text><text x="70" y="933" class="small" text-anchor="start" style="font-size:22px">All five links and loopbacks participate in OSPF process 1, area 0. Colored lines are physical links.</text><text x="70" y="961" class="small" text-anchor="start" style="font-size:22px">R5 Lo0 is configured 10.5.5.5/24; the captured OSPF destination route is 10.5.5.5/32.</text><text x="70" y="989" class="small" text-anchor="start" style="font-size:22px">Baseline files reconstruct relevant commands; no PBR YAML or full running-config export was supplied.</text></svg>