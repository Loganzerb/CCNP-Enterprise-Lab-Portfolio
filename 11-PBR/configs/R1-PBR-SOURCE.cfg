! Reconstructed lab configuration; not a running-config export.
! Relevant baseline settings only. See README.md before applying.
hostname R1-PBR-SOURCE
!
interface GigabitEthernet0/0
 ip address 10.12.1.1 255.255.255.0
 no shutdown
!
interface Loopback0
 ip address 10.1.1.1 255.255.255.0
!
interface Loopback1
 ip address 10.11.11.11 255.255.255.0
!
interface GigabitEthernet0/1
 shutdown
!
interface GigabitEthernet0/2
 shutdown
!
interface GigabitEthernet0/3
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.12.1.0 0.0.0.255 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.11.11.0 0.0.0.255 area 0
!
end
