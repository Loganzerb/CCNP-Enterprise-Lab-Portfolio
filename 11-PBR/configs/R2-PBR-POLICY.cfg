! Reconstructed lab configuration; not a running-config export.
! Relevant baseline settings only. See README.md before applying.
hostname R2-PBR-POLICY
!
interface GigabitEthernet0/0
 ip address 10.12.1.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.23.1.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 ip address 10.24.1.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/3
 shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.12.1.0 0.0.0.255 area 0
 network 10.23.1.0 0.0.0.255 area 0
 network 10.24.1.0 0.0.0.255 area 0
!
ip access-list standard PBR-SOURCE-A
 10 permit 10.1.1.0 0.0.0.255
!
route-map PBR-TO-R3 permit 10
 match ip address PBR-SOURCE-A
 set ip next-hop 10.23.1.3
!
interface GigabitEthernet0/0
 ip policy route-map PBR-TO-R3
!
end
