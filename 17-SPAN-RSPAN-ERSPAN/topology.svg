</style><rect class="bg" width="1200" height="940"/><text x="48" y="59" class="heading">17 / SPAN · RSPAN · ERSPAN</text><text x="48" y="94" class="subtitle">Verify ERSPAN delivery while the original traffic follows its routed path</text><polyline points="318,285 445,285" class="link muted"/><polyline points="755,285 882,285" class="link muted"/><polyline points="600,435 600,615" class="link gold"/><rect x="48" y="195" width="270" height="180" rx="12" class="card"/><path d="M66 196H300" class="accent cyan"/><rect x="445" y="175" width="310" height="260" rx="12" class="card"/><path d="M463 176H737" class="accent cyan"/><rect x="882" y="195" width="270" height="180" rx="12" class="card"/><path d="M900 196H1134" class="accent cyan"/><rect x="445" y="615" width="310" height="175" rx="12" class="card"/><path d="M463 616H737" class="accent gold"/><rect x="48" y="455" width="352" height="170" rx="10" class="note"/><rect x="800" y="455" width="352" height="170" rx="10" class="note"/><rect x="48" y="665" width="352" height="125" rx="10" class="note"/><rect x="800" y="665" width="352" height="125" rx="10" class="note"/><rect x="48" y="829" width="1104" height="86" rx="8" class="note"/><text x="600" y="140" class="small" text-anchor="middle">Original test traffic: 10.10.10.10 ↔ 10.20.20.20</text><text x="183.0" y="231" class="device" text-anchor="middle" style="font-size:24px">R2-SOURCE</text><text x="183.0" y="261" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="183.0" y="288" class="label" text-anchor="middle">Gi0/0: 10.12.12.2/30</text><text x="183.0" y="315" class="label" text-anchor="middle">Lo0: 10.10.10.10/32</text><text x="600.0" y="211" class="device" text-anchor="middle" style="font-size:24px">R1-ERSPAN</text><text x="600.0" y="241" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="600.0" y="268" class="label" text-anchor="middle">Gi1: 10.12.12.1/30</text><text x="600.0" y="295" class="label" text-anchor="middle">Gi2: 10.13.13.1/30</text><text x="600.0" y="322" class="label" text-anchor="middle">Gi3: 10.30.30.1/30</text><text x="600.0" y="349" class="label" text-anchor="middle">Session 1 / ERSPAN ID 100</text><text x="600.0" y="376" class="label" text-anchor="middle">Monitored port: Gi1</text><text x="1017.0" y="231" class="device" text-anchor="middle" style="font-size:24px">R3-DEST</text><text x="1017.0" y="261" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="1017.0" y="288" class="label" text-anchor="middle">Gi0/0: 10.13.13.2/30</text><text x="1017.0" y="315" class="label" text-anchor="middle">Lo0: 10.20.20.20/32</text><text x="381" y="252" class="port" text-anchor="middle" style="font-size:17px">10.12.12.0/30</text><text x="332" y="324" class="port" text-anchor="start">Gi0/0</text><text x="431" y="350" class="port" text-anchor="end">Gi1</text><text x="818" y="252" class="port" text-anchor="middle" style="font-size:17px">10.13.13.0/30</text><text x="769" y="324" class="port" text-anchor="start">Gi2</text><text x="868" y="350" class="port" text-anchor="end">Gi0/0</text><text x="600.0" y="651" class="device" text-anchor="middle" style="font-size:23px">ERSPAN-CAPTURE</text><text x="600.0" y="681" class="label" text-anchor="middle">Alpine Linux 3.13</text><text x="600.0" y="708" class="label" text-anchor="middle">eth0: 10.30.30.2/30</text><text x="600.0" y="735" class="label" text-anchor="middle">Interactive address</text><text x="600.0" y="762" class="label" text-anchor="middle">Inspects mirrored GRE</text><text x="620" y="472" class="port" text-anchor="start">R1 Gi3</text><text x="620" y="525" class="port" text-anchor="start">10.30.30.0/30</text><text x="620" y="590" class="port" text-anchor="start">Collector eth0</text><text x="70" y="489" class="note-heading" text-anchor="start">ORIGINAL PACKET / routed path</text><text x="70" y="519" class="small" text-anchor="start">10.10.10.10 → 10.20.20.20</text><text x="70" y="546" class="small" text-anchor="start">Request: R2 → R1 Gi1 → Gi2 → R3</text><text x="70" y="573" class="small" text-anchor="start">Reply returns through R1 Gi1.</text><text x="70" y="600" class="small" text-anchor="start">Alpine is outside this path.</text><text x="822" y="489" class="note-heading" text-anchor="start">GRE COPY / IP protocol 47</text><text x="822" y="519" class="small" text-anchor="start">Outer: 10.30.30.1 → 10.30.30.2</text><text x="822" y="546" class="small" text-anchor="start">Session 1 selects Gi1 traffic.</text><text x="822" y="573" class="small" text-anchor="start">Alpine reads the original headers.</text><text x="822" y="600" class="small" text-anchor="start">No Cisco destination session.</text><text x="70" y="699" class="note-heading" text-anchor="start">FINAL SOURCE / both directions</text><text x="70" y="729" class="small" text-anchor="start">Export serializes: source interface Gi1</text><text x="70" y="756" class="small" text-anchor="start">Operational output: Both : Gi1</text><text x="70" y="783" class="small" text-anchor="start">RX-only was an earlier test stage.</text><text x="822" y="699" class="note-heading" text-anchor="start">COLLECTOR / restart or import</text><text x="822" y="729" class="small" text-anchor="start">Saved startup omits its IPv4 address.</text><text x="822" y="756" class="small" text-anchor="start">Check and reapply if missing.</text><text x="822" y="783" class="small" text-anchor="start">Gi4 test wiring is not saved here.</text><text x="70" y="861" class="small" text-anchor="start">Solid lines are the three saved physical links. Endpoint forwarding and mirrored delivery are separate paths.</text><text x="70" y="889" class="small" text-anchor="start">Illustration from the saved CML configuration and lab record; collector addressing is reported interactive state.</text></svg>