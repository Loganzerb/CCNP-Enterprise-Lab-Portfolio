<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">17 / SPAN · RSPAN · ERSPAN</title><desc id="desc">Four-node, three-link ERSPAN topology. R2-SOURCE Gi0/0 links to R1-ERSPAN Gi1 on 10.12.12.0/30. R1 Gi2 links to R3-DEST Gi0/0 on 10.13.13.0/30. R1 Gi3 links to ERSPAN-CAPTURE eth0 on 10.30.30.0/30. Session 1 mirrors Gi1 with ERSPAN ID 100 and outer addresses 10.30.30.1 to 10.30.30.2. The collector IPv4 address was interactive and is absent from its saved startup script. Gi4 Local SPAN investigation wiring is not part of this export.</desc><style>
