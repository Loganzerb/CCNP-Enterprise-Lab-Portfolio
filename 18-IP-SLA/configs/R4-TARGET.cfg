hostname R4-TARGET
no ip domain-lookup
!
interface Loopback0
 description IP-SLA-PROBE-TARGET
 ip address 10.40.40.40 255.255.255.255
!
interface Loopback1
 description APPLICATION-TEST-TARGET
 ip address 10.40.40.41 255.255.255.255
!
interface GigabitEthernet0/0
 description TO-R3-ISP-B-BACKUP
 ip address 10.34.34.2 255.255.255.252
 no shutdown
!
