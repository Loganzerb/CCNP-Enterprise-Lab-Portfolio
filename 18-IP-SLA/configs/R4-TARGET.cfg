 description TO-R2-ISP-A-PRIMARY
 ip address 10.24.24.2 255.255.255.252
 no shutdown
!
ip route 10.100.1.1 255.255.255.255 10.24.24.1
ip route 10.100.1.1 255.255.255.255 10.34.34.1 200
end
