hostname R1-BRANCH
no ip domain-lookup
!
interface Loopback0
 description BRANCH-TEST-SOURCE
 ip address 10.100.1.1 255.255.255.255
!
interface GigabitEthernet1
 description TO-R2-ISP-A-PRIMARY
 ip address 10.12.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2
 description TO-R3-ISP-B-BACKUP
 ip address 10.13.13.1 255.255.255.252
 no shutdown
!
ip sla 10
 icmp-echo 10.40.40.40 source-ip 10.100.1.1
 threshold 1000
 timeout 2000
 frequency 10
!
ip sla schedule 10 life forever start-time now
!
track 10 ip sla 10 reachability
!
ip route 0.0.0.0 0.0.0.0 10.12.12.2 track 10
ip route 0.0.0.0 0.0.0.0 10.13.13.2 200
ip route 10.40.40.40 255.255.255.255 10.12.12.2
end
