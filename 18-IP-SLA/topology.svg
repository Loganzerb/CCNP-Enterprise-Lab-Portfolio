</style><rect class="bg" width="1200" height="1020"/><text x="48" y="59" class="heading">18 / IP SLA</text><text x="48" y="94" class="subtitle">Monitor the primary path and choose the application test route</text><polyline points="338,330 390,330 390,240 460,240" class="link gold"/><polyline points="740,240 800,240 800,330 862,330" class="link gold"/><polyline points="338,460 390,460 390,620 460,620" class="link cyan"/><polyline points="740,620 800,620 800,460 862,460" class="link cyan"/><rect x="48" y="280" width="290" height="235" rx="12" class="card"/><path d="M66 281H320" class="accent cyan"/><rect x="460" y="155" width="280" height="170" rx="12" class="card"/><path d="M478 156H722" class="accent gold"/><rect x="460" y="535" width="280" height="170" rx="12" class="card"/><path d="M478 536H722" class="accent cyan"/><rect x="862" y="280" width="290" height="235" rx="12" class="card"/><path d="M880 281H1134" class="accent cyan"/><rect x="48" y="765" width="540" height="135" rx="10" class="note"/><rect x="612" y="765" width="540" height="135" rx="10" class="note"/><rect x="48" y="909" width="1104" height="86" rx="8" class="note"/><text x="600" y="140" class="note-heading" text-anchor="middle">ISP-A / primary path</text><text x="193.0" y="316" class="device" text-anchor="middle" style="font-size:24px">R1-BRANCH</text><text x="193.0" y="346" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="193.0" y="373" class="label" text-anchor="middle">Lo0: 10.100.1.1/32</text><text x="193.0" y="400" class="label" text-anchor="middle">Gi1: 10.12.12.1/30</text><text x="193.0" y="427" class="label" text-anchor="middle">Gi2: 10.13.13.1/30</text><text x="193.0" y="454" class="label" text-anchor="middle">IP SLA 10 / Track 10</text><text x="600.0" y="191" class="device" text-anchor="middle" style="font-size:24px">R2-ISP-A</text><text x="600.0" y="221" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="600.0" y="248" class="label" text-anchor="middle">Gi0/0: 10.12.12.2/30</text><text x="600.0" y="275" class="label" text-anchor="middle">Gi0/1: 10.24.24.1/30</text><text x="600.0" y="571" class="device" text-anchor="middle" style="font-size:24px">R3-ISP-B</text><text x="600.0" y="601" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="600.0" y="628" class="label" text-anchor="middle">Gi0/0: 10.13.13.2/30</text><text x="600.0" y="655" class="label" text-anchor="middle">Gi0/1: 10.34.34.1/30</text><text x="1007.0" y="316" class="device" text-anchor="middle" style="font-size:24px">R4-TARGET</text><text x="1007.0" y="346" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="1007.0" y="373" class="label" text-anchor="middle">Gi0/1: 10.24.24.2/30</text><text x="1007.0" y="400" class="label" text-anchor="middle">Gi0/0: 10.34.34.2/30</text><text x="1007.0" y="427" class="label" text-anchor="middle">Lo0: 10.40.40.40/32</text><text x="1007.0" y="454" class="label" text-anchor="middle">Lo1: 10.40.40.41/32</text><rect x="318.99" y="252" width="142.02" height="28" rx="3" fill="#061e32"/><text x="390" y="273" class="port" text-anchor="middle" style="font-size:18px">10.12.12.0/30</text><rect x="728.99" y="252" width="142.02" height="28" rx="3" fill="#061e32"/><text x="800" y="273" class="port" text-anchor="middle" style="font-size:18px">10.24.24.0/30</text><rect x="318.99" y="544" width="142.02" height="28" rx="3" fill="#061e32"/><text x="390" y="565" class="port" text-anchor="middle" style="font-size:18px">10.13.13.0/30</text><rect x="728.99" y="544" width="142.02" height="28" rx="3" fill="#061e32"/><text x="800" y="565" class="port" text-anchor="middle" style="font-size:18px">10.34.34.0/30</text><rect x="351" y="293" width="46.620000000000005" height="28" rx="3" fill="#061e32"/><text x="351" y="314" class="port" text-anchor="start">Gi1</text><rect x="381.3" y="199" width="65.7" height="28" rx="3" fill="#061e32"/><text x="447" y="220" class="port" text-anchor="end">Gi0/0</text><rect x="753" y="199" width="65.7" height="28" rx="3" fill="#061e32"/><text x="753" y="220" class="port" text-anchor="start">Gi0/1</text><rect x="783.3" y="293" width="65.7" height="28" rx="3" fill="#061e32"/><text x="849" y="314" class="port" text-anchor="end">Gi0/1</text><rect x="351" y="468" width="46.620000000000005" height="28" rx="3" fill="#061e32"/><text x="351" y="489" class="port" text-anchor="start">Gi2</text><rect x="381.3" y="631" width="65.7" height="28" rx="3" fill="#061e32"/><text x="447" y="652" class="port" text-anchor="end">Gi0/0</text><rect x="753" y="631" width="65.7" height="28" rx="3" fill="#061e32"/><text x="753" y="652" class="port" text-anchor="start">Gi0/1</text><rect x="783.3" y="468" width="65.7" height="28" rx="3" fill="#061e32"/><text x="849" y="489" class="port" text-anchor="end">Gi0/0</text><text x="600" y="730" class="label" text-anchor="middle" style="font-size:20px">ISP-B / floating backup path</text><text x="70" y="799" class="note-heading" text-anchor="start">PROBE / 10.40.40.40</text><text x="70" y="829" class="small" text-anchor="start">The /32 route stays through R2 while its next hop resolves.</text><text x="70" y="856" class="small" text-anchor="start">Source: 10.100.1.1; probe frequency: 10 seconds.</text><text x="70" y="883" class="small" text-anchor="start">Threshold: 1000 ms; timeout: 2000 ms.</text><text x="634" y="799" class="note-heading" text-anchor="start">APPLICATION TEST / 10.40.40.41</text><text x="634" y="829" class="small" text-anchor="start">Track Up: R2 default (AD 1).</text><text x="634" y="856" class="small" text-anchor="start">Track Down: R3 floating default (AD 200).</text><text x="634" y="883" class="small" text-anchor="start">Temporary outage: R2 Gi0/1; R1 Gi1 stays up/up.</text><text x="70" y="941" class="small" text-anchor="start">Solid lines show the four saved physical links; colors distinguish the primary and backup provider paths.</text><text x="70" y="969" class="small" text-anchor="start">Probe and application addresses serve different purposes. Timing and interruption guarantees are not implied.</text></svg>