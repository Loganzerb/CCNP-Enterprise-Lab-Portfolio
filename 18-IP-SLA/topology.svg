<svg width="1200" height="1020" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">18 / IP SLA</title><desc id="desc">Four-router, four-link IP SLA topology. R1-BRANCH Gi1 connects to R2-ISP-A Gi0/0 on 10.12.12.0/30; R1 Gi2 connects to R3-ISP-B Gi0/0 on 10.13.13.0/30. R2 Gi0/1 connects to R4-TARGET Gi0/1 on 10.24.24.0/30. R3 Gi0/1 connects to R4 Gi0/0 on 10.34.34.0/30. R1 Loopback0 10.100.1.1 sources IP SLA 10 to R4 Loopback0 10.40.40.40. The probe host route stays through R2 while its next hop resolves. R4 Loopback1 10.40.40.41 is the separate application test address. Track 10 controls the primary default; an AD 200 default supplies the backup path. The controlled outage shuts R2 Gi0/1 while R1 Gi1 remains up/up. This is an illustration from the saved configuration, not a captured runtime display.</desc><style>
