</style><rect class="bg" width="1200" height="740"/><text x="48" y="59" class="heading">19 / NETCONF · RESTCONF</text><text x="48" y="94" class="subtitle">Read, edit, and verify one interface through two management APIs</text><polyline points="438,320 762,320" class="link cyan"/><rect x="48" y="195" width="390" height="225" rx="12" class="card"/><path d="M66 196H420" class="accent cyan"/><rect x="762" y="195" width="390" height="225" rx="12" class="card"/><path d="M780 196H1134" class="accent gold"/><rect x="48" y="465" width="540" height="130" rx="10" class="note"/><rect x="612" y="465" width="540" height="130" rx="10" class="note"/><rect x="48" y="629" width="1104" height="86" rx="8" class="note"/><text x="243.0" y="231" class="device" text-anchor="middle" style="font-size:24px">LINUX-AUTOMATION</text><text x="243.0" y="261" class="label" text-anchor="middle">CML desktop / Alpine client</text><text x="243.0" y="288" class="label" text-anchor="middle">eth0: 192.0.2.20/24</text><text x="243.0" y="315" class="label" text-anchor="middle">Manual SSH client</text><text x="243.0" y="342" class="label" text-anchor="middle">Manual OpenSSL HTTPS requests</text><text x="243.0" y="369" class="label" text-anchor="middle">Saved address initialization</text><text x="957.0" y="231" class="device" text-anchor="middle" style="font-size:24px">R1-AUTOMATION</text><text x="957.0" y="261" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="957.0" y="288" class="label" text-anchor="middle">Gi1: 192.0.2.10/24</text><text x="957.0" y="315" class="label" text-anchor="middle">NETCONF over SSH / 830</text><text x="957.0" y="342" class="label" text-anchor="middle">RESTCONF over HTTPS / 443</text><text x="957.0" y="369" class="label" text-anchor="middle">AAA / HTTP authentication: local</text><text x="600" y="285" class="port" text-anchor="middle" style="font-size:20px">192.0.2.0/24</text><text x="451" y="353" class="port" text-anchor="start" style="font-size:20px">eth0</text><text x="749" y="353" class="port" text-anchor="end" style="font-size:20px">Gi1</text><text x="600" y="390" class="small" text-anchor="middle">One physical management link</text><text x="70" y="499" class="note-heading" text-anchor="start">MODEL AND OPERATIONS</text><text x="70" y="529" class="small" text-anchor="start">Cisco native model / GigabitEthernet key 1</text><text x="70" y="556" class="small" text-anchor="start">NETCONF: running reads and merge edit</text><text x="70" y="583" class="small" text-anchor="start">RESTCONF: GET, PATCH, and readback</text><text x="634" y="499" class="note-heading" text-anchor="start">FINAL SAVED INTERFACE</text><text x="634" y="529" class="small" text-anchor="start">Description: RESTCONF-EDIT-VERIFIED</text><text x="634" y="556" class="small" text-anchor="start">Address retained: 192.0.2.10/24</text><text x="634" y="583" class="small" text-anchor="start">Prepare private account and fresh keys/certificate.</text><text x="70" y="661" class="small" text-anchor="start">Solid line is the saved Ethernet connection. Demonstrated API exchanges used SSH 830 and HTTPS 443.</text><text x="70" y="689" class="small" text-anchor="start">HTTP 80 also remains enabled. Fresh import, executed save, and reboot persistence have not been validated.</text></svg>