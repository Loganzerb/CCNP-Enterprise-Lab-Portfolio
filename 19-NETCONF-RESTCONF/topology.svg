<svg width="1200" height="740" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">19 / NETCONF · RESTCONF</title><desc id="desc">Two-node, one-link NETCONF and RESTCONF lab. LINUX-AUTOMATION uses desktop image desktop-3-13-2-xfce with eth0 at 192.0.2.20/24, directly connected to R1-AUTOMATION GigabitEthernet1 at 192.0.2.10/24. R1 uses CSR1000v IOS XE 17.3.2. NETCONF exchanges use SSH port 830 and RESTCONF exchanges use HTTPS port 443. The final saved Gi1 description is RESTCONF-EDIT-VERIFIED. Plain HTTP port 80 is also enabled in the saved router configuration. Public files omit the original account and generated PKI material; local replacement account and fresh key/certificate preparation are required before reuse. Fresh import, save, and reboot validation have not been performed.</desc><style>
