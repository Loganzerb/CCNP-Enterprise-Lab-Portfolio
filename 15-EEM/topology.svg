<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">15 / Embedded Event Manager</title><desc id="desc">EEM-R1 is a CSR1000v router using GigabitEthernet1 10.66.12.1/30. One physical link connects it to R2-PEER, an IOSv router using GigabitEthernet0/0 10.66.12.2/30. The link subnet is 10.66.12.0/30. EEM applets execute locally on EEM-R1. The retained applets are GI1-DOWN-ALERT and MANUAL-DIAG; watchdog and CLI fault tests were temporary.</desc><style>
