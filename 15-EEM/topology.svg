</style><rect class="bg" width="1200" height="790"/><text x="48" y="59" class="heading">15 / Embedded Event Manager</text><text x="48" y="94" class="subtitle">Local event detection and diagnostics in a two-router CML lab</text><polyline points="455,290 745,290" class="link cyan"/><rect x="65" y="185" width="390" height="220" rx="12" class="card"/><path d="M83 186H437" class="accent cyan"/><rect x="745" y="185" width="390" height="220" rx="12" class="card"/><path d="M763 186H1117" class="accent gold"/><rect x="65" y="455" width="510" height="175" rx="10" class="note"/><rect x="605" y="455" width="530" height="175" rx="10" class="note"/><rect x="48" y="679" width="1104" height="86" rx="8" class="note"/><text x="260.0" y="221" class="device" text-anchor="middle" style="font-size:24px">EEM-R1</text><text x="260.0" y="251" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="260.0" y="278" class="label" text-anchor="middle">Gi1: 10.66.12.1/30</text><text x="260.0" y="305" class="label" text-anchor="middle">Local event detectors and CLI actions</text><text x="940.0" y="221" class="device" text-anchor="middle" style="font-size:24px">R2-PEER</text><text x="940.0" y="251" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="940.0" y="278" class="label" text-anchor="middle">Gi0/0: 10.66.12.2/30</text><text x="940.0" y="305" class="label" text-anchor="middle">Connectivity peer / testbed endpoint</text><text x="600" y="258" class="label" text-anchor="middle">10.66.12.0/30</text><text x="478" y="324" class="port" text-anchor="start">Gi1</text><text x="722" y="324" class="port" text-anchor="end">Gi0/0</text><text x="600" y="360" class="small" text-anchor="middle">One physical link</text><text x="87" y="489" class="note-heading" text-anchor="start">RETAINED / GI1-DOWN-ALERT</text><text x="87" y="519" class="small" text-anchor="start">Gi1 line-protocol down syslog → event detector</text><text x="87" y="546" class="small" text-anchor="start">Local CLI interface check → $_cli_result → syslog</text><text x="627" y="489" class="note-heading" text-anchor="start">RETAINED / MANUAL-DIAG</text><text x="627" y="519" class="small" text-anchor="start">Administrator runs the event none applet.</text><text x="627" y="546" class="small" text-anchor="start">Local CLI output → console puts + completion syslog</text><text x="70" y="711" class="small" text-anchor="start">Watchdog, syslog-pattern fault and CLI event exercises used temporary policies removed from the final export.</text><text x="70" y="739" class="small" text-anchor="start">All EEM actions execute on EEM-R1; R2-PEER supplies the connected peer used in this lab.</text></svg>