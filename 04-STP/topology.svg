<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc">
<title id="title">STP topology: safe redundancy and preferred roots</title>
<desc id="desc">Saved five-switch Rapid PVST+ topology using long path costs, with two configured VLAN 10 endpoints. SW1-DIST-A prefers VLANs 10 and 20 at priority 24576; SW4-DIST-B prefers VLANs 30 and 40 at priority 24576. Exact wiring: SW1 Gi0/0 to SW2 Gi0/0; SW1 Gi0/1 to SW3 Gi0/0; SW2 Gi0/1 to SW4 Gi0/0; SW3 Gi0/1 to SW4 Gi0/1; SW2 Gi0/2 to SW3 Gi0/2; SW2 Gi0/3 to PC1 eth0; SW3 Gi0/3 to PC2 eth0; SW4 Gi0/2 to SW5 Gi0/0; SW4 Gi0/3 to SW5 Gi0/1. PC1 is configured as 192.168.10.11/24 and PC2 as 192.168.10.12/24. SW5-ROGUE is a controlled test switch. Its two uplinks are separate trunks in the saved configuration. A separate earlier LACP stage temporarily bundled them as Po1, with captured short costs of 3 while healthy and 4 after one member failed. This diagram depicts wiring and configured preferences; it does not assert a simultaneous forwarding snapshot or client test result.</desc>
