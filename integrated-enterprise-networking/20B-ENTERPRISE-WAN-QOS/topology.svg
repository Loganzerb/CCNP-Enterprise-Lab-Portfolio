    <text x="858" y="850" class="label" text-anchor="start">932 missing iPerf datagrams.</text>
    <text x="858" y="882" class="label" text-anchor="start">AF21 recovery: +2,391 ingress and</text>
    <text x="858" y="907" class="label" text-anchor="start">+2,391 egress business classifications.</text>
    <text x="858" y="939" class="muted" text-anchor="start">Temporary policer removed.</text>
    <text x="858" y="964" class="muted" text-anchor="start">IOSv forwarding limits apply.</text>
    <text x="858" y="989" class="muted" text-anchor="start">HQoS output-drop mechanism unresolved.</text>
  </g>
  <g id="diagram-provenance" class="diagram-provenance">
