    <text x="889" y="605" class="muted" text-anchor="start">1,200 kbps priority allocation</text>
    <text x="889" y="629" class="label" text-anchor="start">BUSINESS-AF21 · CBWFQ</text>
    <text x="889" y="651" class="muted" text-anchor="start">300 kbps minimum in congestion</text>
    <text x="889" y="677" class="label" text-anchor="start">class-default · remaining traffic</text>
  </g>
  <g id="historical-evidence" class="engineering-callout">
