<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title desc">
  <title id="title">20B / Enterprise WAN QoS</title>
  <desc id="desc">Seven devices and seven physical links. PC-CLIENT eth0 connects to R1-CORE Gi0/0. The preferred static path crosses R1 Gi0/1 to R2-EDGE-A Gi0/0, then R2 Gi0/1 to R4-ISP-A Gi0/0. The configured floating path uses R1 Gi0/2 to R3-EDGE-B Gi0/0, R3 Gi0/1 to R5-ISP-B Gi0/0, and R5 Gi0/1 to R4 Gi0/1. R4 Gi0/2 connects to PC-SERVER eth0. R2 marks client-to-server UDP port 5001 as EF and TCP port 5002 as AF21. Its 2 Mbps WAN-SHAPE parent invokes WAN-OUT for EF strict priority, AF21 minimum bandwidth allocation, and default traffic. The historical ingress policer dropped 932 packets, matching the iPerf loss, and the AF21 correction restored classification for 2,391 packets. The temporary policer was removed. IOSv limits apply and the hierarchical policy's separate output-drop mechanism remains unresolved. Engineering illustration based on the saved CML topology, with separate historical lab results.</desc>
