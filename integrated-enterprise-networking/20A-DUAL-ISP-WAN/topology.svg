  <text x="350" y="999" class="small">Logical session or monitor</text>

  <g id="tracking-summary">
    <rect x="48" y="1025" width="552" height="214" rx="12" class="note"/>
    <text x="70" y="1062" class="note-heading">TRACKED STATIC DEFAULT</text>
    <text x="70" y="1095" class="label">Primary · 10.20.12.2 · AD 1 · Track 10</text>
    <text x="70" y="1124" class="label">Floating backup · 10.20.13.2 · AD 10</text>
    <text x="70" y="1153" class="small">IP SLA 10 · ICMP Echo to 4.4.4.4</text>
    <text x="70" y="1182" class="small">Source 10.20.12.1 · every 5 seconds</text>
    <text x="70" y="1211" class="small">Track 10 monitors IP SLA reachability.</text>
  </g>
  <g id="recorded-sequence">
    <rect x="640" y="1025" width="552" height="214" rx="12" class="note"/>
    <text x="662" y="1062" class="note-heading">RECORDED ROUTE AND CEF SELECTION</text>
    <text x="662" y="1095" class="label">Primary available → Track Up → AD 1</text>
    <text x="662" y="1124" class="label">Upstream failure → Track Down → AD 10</text>
    <text x="662" y="1153" class="label">Primary restored → Track Up → AD 1</text>
    <text x="662" y="1182" class="small">CEF lookups establish next-hop selection.</text>
    <text x="662" y="1211" class="small">End-to-end backup delivery remains untested.</text>
  </g>
  <text x="48" y="1270" class="small">Independently drawn from the saved CML topology and historical lab evidence.</text>
</svg>
