<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1290" viewBox="0 0 1240 1290" role="img" aria-labelledby="title desc">
  <title id="title">20A / Dual-ISP Enterprise WAN</title>
  <desc id="desc">Independently drawn Cisco Modeling Labs topology with eight devices and eight physical Ethernet links. PC-USERS eth0 and PC-SERVERS eth0 connect to access switch ports Gi0/1 and Gi0/2 for VLANs 10 and 20. SW1 Gi0/0 trunks to R1 Gi0/0. R1 Gi0/1 and Gi0/2 connect to R2 and R3 Gi0/0 on OSPF Area 0 links. R2 and R3 Gi0/1 connect to R4 and R5 Gi0/0 for provider eBGP. R4 and R5 Gi0/1 form a separate provider eBGP link. Gold dashes show the loopback-based iBGP session across the OSPF underlay and IP SLA monitoring from R1 to R4. The observed default-route and CEF selection moved from R2 to R3 and back as Track 10 changed. End-to-end backup delivery remains untested.</desc>
  <style>
    svg {background:#061e32;font-family:Arial,Helvetica,sans-serif}
    .bg {fill:#061e32}
    .card {fill:#102d43;stroke:#527084;stroke-width:1.5}
    .note {fill:#0c273c;stroke:#456276;stroke-width:1}
    text {fill:#f3f7fa}
    .heading {font-size:32px;font-weight:700}
    .subtitle {font-size:22px;fill:#b9cfdf}
    .device {font-size:25px;font-weight:700}
    .label {font-size:21px}
    .small,.port {font-size:19px;fill:#c0d3df}
    .network {font-size:20px;font-weight:700;fill:#d8eef4}
    .note-heading,.logical-label {font-size:20px;font-weight:700;fill:#e5bb6d}
    .link,.accent,.logical {fill:none;stroke-linecap:round;stroke-linejoin:round}
    .link,.accent {stroke:#63ceda;stroke-width:3}
    .logical {stroke:#e5bb6d;stroke-width:2.7;stroke-dasharray:8 6}
  </style>
  <defs>
    <marker id="monitor-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#e5bb6d" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect class="bg" width="1240" height="1290"/>
  <text x="48" y="58" class="heading">20A / DUAL-ISP ENTERPRISE WAN</text>
  <text x="48" y="96" class="subtitle">OSPF and BGP integration with IP SLA-tracked WAN failover and automatic recovery</text>

  <!-- Physical Ethernet links. Endpoint IDs map to the saved interface labels. -->
  <g id="physical-links">
