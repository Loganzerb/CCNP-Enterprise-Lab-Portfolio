    <path id="servers-access" class="link" d="M910 240V265H715V291" data-from="PC-SERVERS:eth0" data-to="SW1-ACCESS:Gi0/2"/>
    <path id="access-core" class="link" d="M620 369V432" data-from="SW1-ACCESS:Gi0/0" data-to="R1-CORE:Gi0/0"/>
    <path id="core-edge-a" class="link" d="M482 550V588H330V650" data-from="R1-CORE:Gi0/1" data-to="R2-EDGE-A:Gi0/0" data-from-address="10.20.12.1/30" data-to-address="10.20.12.2/30" data-network="10.20.12.0/30"/>
    <path id="core-edge-b" class="link" d="M758 550V588H910V650" data-from="R1-CORE:Gi0/2" data-to="R3-EDGE-B:Gi0/0" data-from-address="10.20.13.1/30" data-to-address="10.20.13.2/30" data-network="10.20.13.0/30"/>
    <path id="edge-a-isp-a" class="link" d="M330 750V858" data-from="R2-EDGE-A:Gi0/1" data-to="R4-ISP-A:Gi0/0" data-from-address="198.51.100.1/30" data-to-address="198.51.100.2/30" data-network="198.51.100.0/30"/>
    <path id="edge-b-isp-b" class="link" d="M910 750V858" data-from="R3-EDGE-B:Gi0/1" data-to="R5-ISP-B:Gi0/0" data-from-address="203.0.113.1/30" data-to-address="203.0.113.2/30" data-network="203.0.113.0/30"/>
    <path id="isp-interconnect" class="link" d="M485 909H755" data-from="R4-ISP-A:Gi0/1" data-to="R5-ISP-B:Gi0/1" data-from-address="192.0.2.1/30" data-to-address="192.0.2.2/30" data-network="192.0.2.0/30"/>
  </g>
  <g id="logical-relationships">
    <path id="edge-ibgp" class="logical" d="M485 701H755" data-from="R2-EDGE-A:Lo0" data-to="R3-EDGE-B:Lo0"/>
    <path id="sla-monitor" class="logical" d="M405 474H81V909H175" marker-end="url(#monitor-arrow)" data-from="R1-CORE:Gi0/1" data-to="R4-ISP-A:Lo0"/>
  </g>

