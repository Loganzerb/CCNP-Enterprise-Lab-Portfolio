<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">13 / VRF-Lite and selective shared access</title><desc id="desc">BLUE-CE Gi0/0 connects to R1-VRF Gi0/0 in BLUE. RED-CE Gi0/0 connects to R1-VRF Gi0/1 in RED. Both transit links use 10.10.10.0/24 but remain separate segments. Later SHARED-SVC Gi0/0 attaches to R1 Gi0/2 in global context. CE loopbacks and selective static routes are later additions; final service-initiated ICMP tests succeeded to each unique CE endpoint.</desc><style>
svg {background:#061e32;font-family:Arial,Helvetica,sans-serif}
.bg {fill:#061e32} .card {fill:#102d43;stroke:#527084;stroke-width:1.5}
text {fill:#f3f7fa} .heading {font-size:31px;font-weight:700}
.subtitle {font-size:20px;fill:#b9cfdf} .device {font-size:24px;font-weight:700}
.label {font-size:19px} .small {font-size:17px;fill:#c0d3df}
.port {font-size:18px;fill:#c0d3df}
.cyan {stroke:#63ceda} .gold {stroke:#e5bb6d} .muted {stroke:#86a6be}
.link {fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.accent {stroke-width:3;fill:none}
.note {fill:#0c273c;stroke:#456276;stroke-width:1}
.note-heading {font-size:20px;font-weight:700;fill:#e5bb6d}
.region {fill:none;stroke:#63ceda;stroke-width:2;stroke-dasharray:10 8}
.region-title {font-size:24px;font-weight:700;fill:#63ceda}
</style><rect class="bg" width="1600" height="1180"/><text x="48" y="59" class="heading">13 / VRF-Lite and selective shared access</text><text x="48" y="94" class="subtitle">Separate BLUE and RED contexts reuse the same transit and remote addresses</text><rect x="48" y="295" width="400" height="340" rx="16" class="region"/><rect x="1152" y="295" width="400" height="340" rx="16" class="region"/><polyline points="430,455 610,455" class="link cyan"/><polyline points="990,455 1170,455" class="link gold"/><polyline points="800,605 800,820" class="link muted"/><rect x="65" y="135" width="720" height="125" rx="10" class="note"/><rect x="815" y="135" width="720" height="125" rx="10" class="note"/><rect x="65" y="365" width="365" height="240" rx="12" class="card"/><path d="M83 366H412" class="accent cyan"/><rect x="1170" y="365" width="365" height="240" rx="12" class="card"/><path d="M1188 366H1517" class="accent gold"/><rect x="610" y="365" width="380" height="240" rx="12" class="card"/><path d="M628 366H972" class="accent cyan"/><rect x="610" y="820" width="380" height="175" rx="12" class="card"/><path d="M628 821H972" class="accent muted"/><rect x="65" y="705" width="455" height="230" rx="10" class="note"/><rect x="1080" y="705" width="455" height="230" rx="10" class="note"/><rect x="48" y="1041" width="1504" height="114" rx="8" class="note"/><text x="87" y="169" class="note-heading" text-anchor="start" style="font-size:22px">SAVED CHECKPOINT / three routers, two links</text><text x="87" y="199" class="small" text-anchor="start" style="font-size:22px">BLUE-CE — R1-VRF — RED-CE; overlap is already present.</text><text x="87" y="226" class="small" text-anchor="start" style="font-size:22px">No service node or later CE loopbacks in the baseline YAML.</text><text x="837" y="169" class="note-heading" text-anchor="start" style="font-size:22px">LATER ADDITIONS / illustrated below</text><text x="837" y="199" class="small" text-anchor="start" style="font-size:22px">Duplicate Lo0 + unique Lo10/Lo20; SHARED-SVC + routes.</text><text x="837" y="226" class="small" text-anchor="start" style="font-size:22px">No final four-node CML export was supplied.</text><text x="73" y="333" class="region-title" text-anchor="start">BLUE / separate segment</text><text x="1177" y="333" class="region-title" text-anchor="start">RED / separate segment</text><text x="247.5" y="401" class="device" text-anchor="middle" style="font-size:28px">BLUE-CE</text><text x="247.5" y="431" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.10.10.2/24</text><text x="247.5" y="458" class="label" text-anchor="middle" style="font-size:22px">Later Lo0: 172.16.100.1/32</text><text x="247.5" y="485" class="label" text-anchor="middle" style="font-size:22px">Later Lo10: 192.168.10.10/32</text><text x="247.5" y="512" class="label" text-anchor="middle" style="font-size:22px">Local VRF not required</text><text x="1352.5" y="401" class="device" text-anchor="middle" style="font-size:28px">RED-CE</text><text x="1352.5" y="431" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.10.10.2/24</text><text x="1352.5" y="458" class="label" text-anchor="middle" style="font-size:22px">Later Lo0: 172.16.100.1/32</text><text x="1352.5" y="485" class="label" text-anchor="middle" style="font-size:22px">Later Lo20: 192.168.20.20/32</text><text x="1352.5" y="512" class="label" text-anchor="middle" style="font-size:22px">Local VRF not required</text><text x="800.0" y="401" class="device" text-anchor="middle" style="font-size:28px">R1-VRF</text><text x="800.0" y="431" class="label" text-anchor="middle" style="font-size:22px">Gi0/0 / BLUE: 10.10.10.1/24</text><text x="800.0" y="458" class="label" text-anchor="middle" style="font-size:22px">Gi0/1 / RED: 10.10.10.1/24</text><text x="800.0" y="485" class="label" text-anchor="middle" style="font-size:22px">Gi0/2 / global: 172.16.50.1/24</text><text x="800.0" y="512" class="label" text-anchor="middle" style="font-size:22px">Local VRF-Lite / static routes</text><rect x="435.21" y="395" width="169.58" height="32" rx="3" fill="#061e32"/><text x="520" y="420" class="port" text-anchor="middle" style="font-size:22px">10.10.10.0/24</text><text x="465" y="490" class="port" text-anchor="start" style="font-size:22px">CE Gi0/0</text><text x="595" y="519" class="port" text-anchor="end" style="font-size:22px">R1 Gi0/0</text><rect x="995.21" y="395" width="169.58" height="32" rx="3" fill="#061e32"/><text x="1080" y="420" class="port" text-anchor="middle" style="font-size:22px">10.10.10.0/24</text><text x="1005" y="490" class="port" text-anchor="start" style="font-size:22px">R1 Gi0/1</text><text x="1135" y="519" class="port" text-anchor="end" style="font-size:22px">CE Gi0/0</text><text x="800.0" y="856" class="device" text-anchor="middle" style="font-size:28px">SHARED-SVC</text><text x="800.0" y="886" class="label" text-anchor="middle" style="font-size:22px">Later global service addition</text><text x="800.0" y="913" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 172.16.50.10/24</text><text x="800.0" y="940" class="label" text-anchor="middle" style="font-size:22px">Default via 172.16.50.1</text><rect x="822" y="633" width="111.28" height="32" rx="3" fill="#061e32"/><text x="822" y="658" class="port" text-anchor="start" style="font-size:22px">R1 Gi0/2</text><rect x="822" y="686" width="181.24" height="32" rx="3" fill="#061e32"/><text x="822" y="711" class="port" text-anchor="start" style="font-size:22px">172.16.50.0/24</text><rect x="822" y="766" width="169.58" height="32" rx="3" fill="#061e32"/><text x="822" y="791" class="port" text-anchor="start" style="font-size:22px">Service Gi0/0</text><text x="87" y="739" class="note-heading" text-anchor="start" style="font-size:22px">RETURN PATH / global host routes</text><text x="87" y="769" class="small" text-anchor="start" style="font-size:22px">192.168.10.10/32 → R1 Gi0/0</text><text x="87" y="796" class="small" text-anchor="start" style="font-size:22px">192.168.20.20/32 → R1 Gi0/1</text><text x="87" y="823" class="small" text-anchor="start" style="font-size:22px">Both next hops are 10.10.10.2;</text><text x="87" y="850" class="small" text-anchor="start" style="font-size:22px">explicit egress selects the correct CE.</text><text x="87" y="877" class="small" text-anchor="start" style="font-size:22px">Observed on the retained IOSv image.</text><text x="1102" y="739" class="note-heading" text-anchor="start" style="font-size:22px">FORWARD PATH / service host route</text><text x="1102" y="769" class="small" text-anchor="start" style="font-size:22px">BLUE and RED each route 172.16.50.10/32</text><text x="1102" y="796" class="small" text-anchor="start" style="font-size:22px">through 172.16.50.10 in global context.</text><text x="1102" y="823" class="small" text-anchor="start" style="font-size:22px">CE host routes return toward the service</text><text x="1102" y="850" class="small" text-anchor="start" style="font-size:22px">through their local 10.10.10.1 gateway.</text><text x="1102" y="877" class="small" text-anchor="start" style="font-size:22px">No BLUE ↔ RED route exchange.</text><text x="70" y="1073" class="small" text-anchor="start" style="font-size:22px">Physical connections shown; identical transit addresses belong to separate segments and routing contexts.</text><text x="70" y="1101" class="small" text-anchor="start" style="font-size:22px">Final captured test: SHARED-SVC → 192.168.10.10 and 192.168.20.20, 5/5 ICMP replies each.</text><text x="70" y="1129" class="small" text-anchor="start" style="font-size:22px">Those exchanges prove the tested request/reply paths. Independently initiated CE-to-service probes were not retained.</text></svg>