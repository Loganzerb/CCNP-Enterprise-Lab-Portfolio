<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 947" role="img" aria-labelledby="title desc"><title id="title">03 / BGP</title><desc id="desc">Logical BGP sessions, not physical wiring or traffic flow. O2 reflects routes for O1 and O4. O4 peers with B1 and B2 on one shared /29; B1 and B2 do not peer. The B1-X1 loopback session shares its direct connection.</desc><style>
