t-size:24px">O1-CORE</text><text x="168.33333333333331" y="190.66666666666666" class="label" text-anchor="middle">RR client</text><text x="168.33333333333331" y="208.66666666666666" class="label" text-anchor="middle">Lo0 10.100.1.1/32</text><text x="168.33333333333331" y="317.3333333333333" class="device" text-anchor="middle" style="font-size:24px">O2-ABR</text><text x="168.33333333333331" y="337.3333333333333" class="label" text-anchor="middle">Route reflector</text><text x="168.33333333333331" y="355.3333333333333" class="label" text-anchor="middle">Lo0 10.100.2.2/32</text><text x="168.33333333333331" y="467.3333333333333" class="device" text-anchor="middle" style="font-size:24px">O4-EDGE</text><text x="168.33333333333331" y="487.3333333333333" class="label" text-anchor="middle">RR client</text><text x="168.33333333333331" y="505.3333333333333" class="label" text-anchor="middle">Lo0 10.100.4.4/32</text><text x="600.0" y="164.0" class="device" text-anchor="middle" style="font-size:24px">B1-ISP-A</text><text x="600.0" y="184.0" class="label" text-anchor="middle">Lo0 10.255.1.1/32</text><text x="600.0" y="202.0" class="label" text-anchor="middle">Provider A</text><text x="600.0" y="477.3333333333333" class="device" text-anchor="middle" style="font-size:24px">B2-ISP-B</text><text x="600.0" y="497.3333333333333" class="label" text-anchor="middle">Lo0 10.255.2.2/32</text><text x="600.0" y="515.3333333333333" class="label" text-anchor="middle">Provider B</text><text x="1030.0" y="344.0" class="device" text-anchor="middle" style="font-size:24px">X1-OUTSIDE</text><text x="1030.0" y="364.0" class="label" text-anchor="middle">Lo0 10.255.3.3/32</text><text x="1030.0" y="382.0" class="label" text-anchor="middle">Outside routing domain</text><text x="168.0" y="265.3333333333333" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Loopback iBGP</text><text x="168.0" y="414.66666666666663" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Loopback iBGP</text><text x="383.3333333333333" y="172.0" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">10.250.1.0/30</text><text x="420.0" y="340.0" class="port" text-anchor="start">O4 ↔ B1</text><text x="383.3333333333333" y="480.0" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">O4 ↔ B2</text><text x="806.6666666666666" y="200.0" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">10.250.3.0/30</text><text x="810.0" y="506.66666666666663" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">10.250.4.0/30</text><text x="990.0" y="123.33333333333333" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Loopback eBGP · multihop 2</text><text x="348.0" y="589.3333333333333" class="note-heading" text-anchor="start">Shared segment · 10.250.2.0/29</text><text x="348.0" y="609.3333333333333" class="small" text-anchor="start">O4 Gi0/3 10.250.2.1</text><text x="348.0" y="627.3333333333333" class="small" text-anchor="start">B1 Gi0/2 10.250.2.3</text><text x="348.0" y="645.3333333333333" class="small" text-anchor="start">B2 Gi0/0 10.250.2.2</text><text x="348.0" y="663.3333333333333" class="small" text-anchor="start">No configured B1–B2 BGP session</text><text x="808.0" y="589.3333333333333" class="note-heading" text-anchor="start">Session key</text><text x="808.0" y="609.3333333333333" class="small" text-anchor="start">Cyan: direct eBGP</text><text x="808.0" y="627.3333333333333" class="small" text-anchor="start">Gold dashed: loopback iBGP</text><text x="808.0" y="645.3333333333333" class="small" text-anchor="start">Muted dashed: loopback eBGP</text><text x="46.666666666666664" y="712.6666666666666" class="note-heading" text-anchor="start">Internal loopback reachability</text><text x="46.666666666666664" y="732.6666666666666" class="small" text-anchor="start">O1 Gi0/0 10.100.12.1/30 ↔ O2 Gi0/0 10.100.12.2</text><text x="46.666666666666664" y="750.6666666666666" class="small" text-anchor="start">O2 Gi0/2 10.100.24.1/30 ↔ O4 Gi0/0 10.100.24.2</text><text x="46.666666666666664" y="768.6666666666666" class="small" text-anchor="start">Supporting internal routing is omitted from the extracts</text><text x="648.0" y="712.6666666666666" class="note-heading" text-anchor="start">Direct external endpoints</text><text x="648.0" y="732.6666666666666" class="small" text-anchor="start">O1 Gi0/2 10.250.1.1 ↔ B1 Gi0/0 10.250.1.2</text><text x="648.0" y="750.6666666666666" class="small" text-anchor="start">B1 Gi0/1 10.250.3.1 ↔ X1 Gi0/0 10.250.3.2</text><text x="648.0" y="768.6666666666666" class="small" text-anchor="start">B2 Gi0/1 10.250.4.1 ↔ X1 Gi0/1 10.250.4.2</text><text x="46.666666666666664" y="875.3333333333333" class="small" text-anchor="start">Lines show BGP sessions. The dashed B1–X1 session uses the same connection as direct B1–X1 eBGP.</text><text x="46.666666666666664" y="894.0" class="small" text-anchor="start">The shared segment’s physical device is undocumented. IPv6 and CUSTOMER-A configuration: topology.md.</text><text x="46.666666666666664" y="912.6666666666666" class="small" text-anchor="start">Several advertised test prefixes are Null0-backed; peering and route recovery do not prove application delivery.</text></svg>