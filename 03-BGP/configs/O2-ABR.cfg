! Sanitized BGP-focused configuration derived from the captured running-config.
hostname O2-ABR
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O1-CORE
 ip address 10.100.12.2 255.255.255.252
!
interface GigabitEthernet0/2
 description LINK-TO-O4-EDGE
 ip address 10.100.24.1 255.255.255.252
!
router bgp 65000
 bgp router-id 10.100.2.2
 bgp log-neighbor-changes
 network 172.31.250.0 mask 255.255.255.0
 neighbor 10.100.1.1 remote-as 65000
 neighbor 10.100.1.1 update-source Loopback0
 neighbor 10.100.1.1 route-reflector-client
 neighbor 10.100.4.4 remote-as 65000
 neighbor 10.100.4.4 update-source Loopback0
 neighbor 10.100.4.4 route-reflector-client
!
ip route 172.31.250.0 255.255.255.0 Null0
!
end
