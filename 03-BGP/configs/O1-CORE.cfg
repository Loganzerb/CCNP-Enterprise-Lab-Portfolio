! Sanitized BGP-focused configuration derived from the captured running-config.
hostname O1-CORE
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O2-ABR
 ip address 10.100.12.1 255.255.255.252
!
interface GigabitEthernet0/2
 description EBGP-TO-B1-ISP-A
 ip address 10.250.1.1 255.255.255.252
!
router bgp 65000
 bgp router-id 10.100.1.1
 bgp log-neighbor-changes
 neighbor 10.100.2.2 remote-as 65000
 neighbor 10.100.2.2 update-source Loopback0
 neighbor 10.100.2.2 next-hop-self
 neighbor 10.250.1.2 remote-as 65100
!
ip prefix-list B1-WEIGHT seq 5 permit 203.0.113.0/24
ip prefix-list ENTERPRISE-PREPEND seq 5 permit 172.31.250.0/24
ip prefix-list MED-TEST seq 5 permit 172.31.250.0/24
!
route-map MED-TO-B1 permit 10
 match ip address prefix-list MED-TEST
 set metric 200
route-map MED-TO-B1 permit 20
!
route-map PREPEND-TO-B1 permit 10
 match ip address prefix-list ENTERPRISE-PREPEND
 set as-path prepend 65000
route-map PREPEND-TO-B1 permit 20
!
route-map B1-IN permit 10
 match ip address prefix-list B1-WEIGHT
 set weight 500
route-map B1-IN permit 20
!
end
