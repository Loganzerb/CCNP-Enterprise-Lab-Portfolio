! Sanitized BGP-focused configuration derived from the captured running-config.
hostname O4-EDGE
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.4.4 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O2-ABR
 ip address 10.100.24.2 255.255.255.252
!
interface GigabitEthernet0/3
 description EBGP-TO-B2-ISP-B
 ip address 10.250.2.1 255.255.255.248
!
router bgp 65000
 bgp router-id 10.100.4.4
 bgp log-neighbor-changes
 neighbor 10.100.2.2 remote-as 65000
 neighbor 10.100.2.2 update-source Loopback0
 neighbor 10.100.2.2 next-hop-self
 neighbor 10.250.2.2 remote-as 65200
 neighbor 10.250.2.3 remote-as 65100
!
ip prefix-list B2-PREFERRED seq 5 permit 203.0.113.0/24
ip prefix-list ENTERPRISE-PREPEND seq 5 permit 172.31.250.0/24
ip prefix-list MED-TEST seq 5 permit 172.31.250.0/24
ip prefix-list ORIGIN-TEST seq 5 permit 172.31.250.0/24
!
route-map MED-TO-B1 permit 10
 match ip address prefix-list MED-TEST
 set metric 50
route-map MED-TO-B1 permit 20
!
route-map PREPEND-TO-B2 permit 10
 match ip address prefix-list ENTERPRISE-PREPEND
 set as-path prepend 65000 65000
route-map PREPEND-TO-B2 permit 20
!
route-map B2-IN permit 10
 match ip address prefix-list B2-PREFERRED
 set local-preference 200
route-map B2-IN permit 20
!
route-map ORIGIN-TO-B2 permit 10
 match ip address prefix-list ORIGIN-TEST
 set origin incomplete
route-map ORIGIN-TO-B2 permit 20
!
end
