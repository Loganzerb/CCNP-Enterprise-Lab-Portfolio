! Sanitized BGP-focused configuration derived from the captured running-config.
hostname X1-OUTSIDE
!
vrf definition CUSTOMER-A
 rd 65300:100
 address-family ipv4
 exit-address-family
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.255.3.3 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:DB8:6530::1/64
!
interface Loopback2
 vrf forwarding CUSTOMER-A
 ip address 172.20.20.1 255.255.255.0
!
interface GigabitEthernet0/0
 description EBGP-TO-B1-ISP-A
 ip address 10.250.3.2 255.255.255.252
 ipv6 address 2001:DB8:31::2/64
!
interface GigabitEthernet0/0.100
 encapsulation dot1Q 100
 vrf forwarding CUSTOMER-A
 ip address 10.60.0.2 255.255.255.252
!
interface GigabitEthernet0/1
 description EBGP-TO-B2-ISP-B
 ip address 10.250.4.2 255.255.255.252
!
router bgp 65300
 bgp router-id 10.255.3.3
 bgp log-neighbor-changes
 neighbor 10.250.3.1 remote-as 65100
 neighbor 10.250.3.1 password <REDACTED>
 neighbor 10.250.4.1 remote-as 65200
 neighbor 10.255.1.1 remote-as 65100
 neighbor 10.255.1.1 ebgp-multihop 2
 neighbor 10.255.1.1 update-source Loopback0
 neighbor 2001:DB8:31::1 remote-as 65100
 !
 address-family ipv4
  network 192.0.2.0 mask 255.255.255.128
  network 192.0.2.128 mask 255.255.255.192
  network 192.0.2.224 mask 255.255.255.224
  network 198.51.100.0
  aggregate-address 192.0.2.0 255.255.255.0 summary-only
  redistribute static route-map STATIC-REDIST
  neighbor 10.250.3.1 activate
  neighbor 10.250.3.1 send-community
  neighbor 10.250.3.1 route-map TAG-TO-B1 out
  neighbor 10.250.4.1 activate
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community
  neighbor 10.255.1.1 route-map NOEXPORT-TO-B1 out
  no neighbor 2001:DB8:31::1 activate
 exit-address-family
 !
 address-family ipv6
  network 2001:DB8:6530::/64
  neighbor 2001:DB8:31::1 activate
 exit-address-family
 !
 address-family ipv4 vrf CUSTOMER-A
  network 172.20.20.0 mask 255.255.255.0
  neighbor 10.60.0.1 remote-as 65100
  neighbor 10.60.0.1 activate
 exit-address-family
!
ip route 10.50.50.0 255.255.255.0 Null0
ip route 10.255.1.1 255.255.255.255 10.250.3.1
ip route 192.0.2.0 255.255.255.128 Null0
ip route 192.0.2.128 255.255.255.192 Null0
ip route 192.0.2.224 255.255.255.224 Null0
ip route 198.51.100.0 255.255.255.0 Null0
!
ip prefix-list B1-OUT seq 5 deny 198.51.100.0/24
ip prefix-list B1-OUT seq 10 permit 0.0.0.0/0 le 32
ip prefix-list COMMUNITY-TEST seq 5 permit 198.51.100.0/24
ip prefix-list PREFER-B1-PREFIX seq 5 permit 172.31.250.0/24
ip prefix-list RANGE-TEST seq 5 permit 192.0.2.0/24 ge 25 le 26
ip prefix-list STATIC-TO-BGP seq 5 permit 10.50.50.0/24
!
route-map B1-LOCALPREF permit 10
 match ip address prefix-list PREFER-B1-PREFIX
 set local-preference 200
route-map B1-LOCALPREF permit 20
!
route-map STATIC-REDIST permit 10
 match ip address prefix-list STATIC-TO-BGP
!
route-map TAG-TO-B1 permit 10
 match ip address prefix-list COMMUNITY-TEST
 set community 4279500900
route-map TAG-TO-B1 permit 20
!
route-map FILTER-TO-B1 deny 10
 match ip address prefix-list RANGE-TEST
route-map FILTER-TO-B1 permit 20
!
route-map NOEXPORT-TO-B1 permit 10
 match ip address prefix-list COMMUNITY-TEST
 set community no-export
route-map NOEXPORT-TO-B1 permit 20
!
end
