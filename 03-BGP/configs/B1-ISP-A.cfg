! Sanitized BGP-focused configuration derived from the captured running-config.
hostname B1-ISP-A
!
vrf definition CUSTOMER-A
 rd 65100:100
 address-family ipv4
 exit-address-family
!
ipv6 unicast-routing
!
interface Loopback0
 description BGP-ROUTER-ID
 ip address 10.255.1.1 255.255.255.255
!
interface Loopback1
 ipv6 address 2001:DB8:6510::1/64
!
interface GigabitEthernet0/0
 description EBGP-TO-O1-CORE
 ip address 10.250.1.2 255.255.255.252
!
interface GigabitEthernet0/1
 description EBGP-TO-X1-OUTSIDE
 ip address 10.250.3.1 255.255.255.252
 ipv6 address 2001:DB8:31::1/64
!
interface GigabitEthernet0/1.100
 encapsulation dot1Q 100
 vrf forwarding CUSTOMER-A
 ip address 10.60.0.1 255.255.255.252
!
interface GigabitEthernet0/2
 description EBGP-TO-O4-EDGE
 ip address 10.250.2.3 255.255.255.248
!
router bgp 65100
 bgp router-id 10.255.1.1
 bgp log-neighbor-changes
 neighbor AS65000-PEERS peer-group
 neighbor AS65000-PEERS remote-as 65000
 neighbor 10.250.1.1 remote-as 65000
 neighbor 10.250.1.1 peer-group AS65000-PEERS
 neighbor 10.250.2.1 remote-as 65000
 neighbor 10.250.2.1 peer-group AS65000-PEERS
 neighbor 10.250.3.2 remote-as 65300
 neighbor 10.250.3.2 password <REDACTED>
 neighbor 10.255.3.3 remote-as 65300
 neighbor 10.255.3.3 ebgp-multihop 2
 neighbor 10.255.3.3 update-source Loopback0
 neighbor 2001:DB8:31::2 remote-as 65300
 !
 address-family ipv4
  network 10.255.1.1 mask 255.255.255.255
  network 172.31.251.0 mask 255.255.255.0
  neighbor 10.250.1.1 activate
  neighbor 10.250.2.1 activate
  neighbor 10.250.3.2 activate
  neighbor 10.250.3.2 route-map COMMUNITY-IN in
  neighbor 10.255.3.3 activate
  no neighbor 2001:DB8:31::2 activate
 exit-address-family
 !
 address-family ipv6
  network 2001:DB8:6510::/64
  neighbor 2001:DB8:31::2 activate
 exit-address-family
 !
 address-family ipv4 vrf CUSTOMER-A
  neighbor 10.60.0.2 remote-as 65300
  neighbor 10.60.0.2 activate
 exit-address-family
!
ip bgp-community new-format
ip community-list standard X1-TAG permit 65300:100
ip as-path access-list 10 permit ^65300$
!
ip route 10.255.3.3 255.255.255.255 10.250.3.2
ip route 172.31.251.0 255.255.255.0 Null0
!
ip prefix-list X1-IN seq 5 deny 198.51.100.0/24
ip prefix-list X1-IN seq 10 permit 0.0.0.0/0 le 32
!
route-map COMMUNITY-IN permit 10
 match community X1-TAG
 set local-preference 50
route-map COMMUNITY-IN permit 20
!
end
