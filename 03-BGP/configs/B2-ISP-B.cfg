! Sanitized BGP-focused configuration derived from the captured running-config.
hostname B2-ISP-B
!
interface Loopback0
 description BGP-ROUTER-ID
 ip address 10.255.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description EBGP-TO-O4-EDGE
 ip address 10.250.2.2 255.255.255.248
!
interface GigabitEthernet0/1
 description EBGP-TO-X1-OUTSIDE
 ip address 10.250.4.1 255.255.255.252
!
router bgp 65200
 bgp router-id 10.255.2.2
 bgp log-neighbor-changes
 network 203.0.113.0
 neighbor 10.250.2.1 remote-as 65000
 neighbor 10.250.4.2 remote-as 65300
!
ip route 203.0.113.0 255.255.255.0 Null0
!
end
