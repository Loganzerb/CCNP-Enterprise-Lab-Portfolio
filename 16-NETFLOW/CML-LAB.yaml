     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet4
     no ip address
     shutdown
     negotiation auto
     no mop enabled
     no mop sysid
    !
    ip forward-protocol nd
    ip http server
    ip http authentication local
    ip http secure-server
    !
    ip route 10.10.10.10 255.255.255.255 10.12.12.2
    ip route 10.20.20.20 255.255.255.255 10.13.13.2
