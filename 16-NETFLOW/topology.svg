</style><rect class="bg" width="1200" height="980"/><text x="48" y="59" class="heading">16 / Flexible NetFlow</text><text x="48" y="94" class="subtitle">Monitor ICMP requests at R1 ingress; export measurements to a separate collector</text><polyline points="318,285 445,285" class="link muted"/><polyline points="755,285 882,285" class="link muted"/><polyline points="600,440 600,645" class="link muted"/><rect x="48" y="185" width="270" height="190" rx="12" class="card"/><path d="M66 186H300" class="accent cyan"/><rect x="445" y="170" width="310" height="270" rx="12" class="card"/><path d="M463 171H737" class="accent cyan"/><rect x="882" y="185" width="270" height="190" rx="12" class="card"/><path d="M900 186H1134" class="accent cyan"/><rect x="445" y="645" width="310" height="190" rx="12" class="card"/><path d="M463 646H737" class="accent gold"/><rect x="48" y="455" width="400" height="150" rx="10" class="note"/><rect x="790" y="455" width="362" height="165" rx="10" class="note"/><rect x="48" y="670" width="340" height="155" rx="10" class="note"/><rect x="790" y="670" width="362" height="180" rx="10" class="note"/><rect x="48" y="869" width="1104" height="86" rx="8" class="note"/><text x="600" y="140" class="small" text-anchor="middle">Test request: 10.10.10.10 → 10.20.20.20  /  R2 → R1 → R3</text><text x="183.0" y="221" class="device" text-anchor="middle" style="font-size:24px">R2-SOURCE</text><text x="183.0" y="251" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="183.0" y="278" class="label" text-anchor="middle">Gi0/0: 10.12.12.2/30</text><text x="183.0" y="305" class="label" text-anchor="middle">Lo0: 10.10.10.10/32</text><text x="600.0" y="206" class="device" text-anchor="middle" style="font-size:24px">R1-FNF</text><text x="600.0" y="236" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="600.0" y="263" class="label" text-anchor="middle">Gi1: 10.12.12.1/30</text><text x="600.0" y="290" class="label" text-anchor="middle">Gi2: 10.13.13.1/30</text><text x="600.0" y="317" class="label" text-anchor="middle">Gi3: 10.30.30.1/30</text><text x="600.0" y="344" class="label" text-anchor="middle">Lo0: 10.100.1.1/32</text><text x="600.0" y="371" class="label" text-anchor="middle">Monitor: Gi1 input</text><text x="1017.0" y="221" class="device" text-anchor="middle" style="font-size:24px">R3-DEST</text><text x="1017.0" y="251" class="label" text-anchor="middle">IOSv / IOS 15.9</text><text x="1017.0" y="278" class="label" text-anchor="middle">Gi0/0: 10.13.13.2/30</text><text x="1017.0" y="305" class="label" text-anchor="middle">Lo0: 10.20.20.20/32</text><text x="381" y="253" class="port" text-anchor="middle" style="font-size:17px">10.12.12.0/30</text><text x="334" y="320" class="port" text-anchor="start">Gi0/0</text><text x="429" y="347" class="port" text-anchor="end">Gi1</text><text x="818" y="253" class="port" text-anchor="middle" style="font-size:17px">10.13.13.0/30</text><text x="771" y="320" class="port" text-anchor="start">Gi2</text><text x="866" y="347" class="port" text-anchor="end">Gi0/0</text><text x="600.0" y="681" class="device" text-anchor="middle" style="font-size:24px">FNF-COLLECTOR</text><text x="600.0" y="711" class="label" text-anchor="middle">Alpine Linux 3.13</text><text x="600.0" y="738" class="label" text-anchor="middle">eth0: 10.30.30.2/30</text><text x="600.0" y="765" class="label" text-anchor="middle">Reported interactive address</text><text x="600.0" y="792" class="label" text-anchor="middle">Receives export metadata</text><text x="620" y="480" class="port" text-anchor="start">R1 Gi3</text><text x="620" y="535" class="port" text-anchor="start">10.30.30.0/30</text><text x="620" y="615" class="port" text-anchor="start">Collector eth0</text><text x="70" y="489" class="note-heading" text-anchor="start">MONITORED REQUEST / Gi1 input</text><text x="70" y="519" class="small" text-anchor="start">10.10.10.10 → 10.20.20.20</text><text x="70" y="546" class="small" text-anchor="start">Gi1 input monitor observes incoming ICMP.</text><text x="70" y="573" class="small" text-anchor="start">Forwarding continues through Gi2 to R3.</text><text x="812" y="489" class="note-heading" text-anchor="start">EXPORT / NetFlow v9 over UDP</text><text x="812" y="519" class="small" text-anchor="start">10.30.30.1 → 10.30.30.2</text><text x="812" y="546" class="small" text-anchor="start">Source: R1 Gi3; destination UDP 2055</text><text x="812" y="573" class="small" text-anchor="start">Alpine receives flow measurements.</text><text x="812" y="600" class="small" text-anchor="start">Exports carry metadata about test ICMP.</text><text x="70" y="704" class="note-heading" text-anchor="start">ALPINE / address portability</text><text x="70" y="734" class="small" text-anchor="start">eth0 was addressed interactively.</text><text x="70" y="761" class="small" text-anchor="start">YAML startup omits the eth0 address.</text><text x="70" y="788" class="small" text-anchor="start">May need reapplying after restart/import.</text><text x="812" y="704" class="note-heading" text-anchor="start">Lo0 DESCRIPTION / label only</text><text x="812" y="734" class="small" text-anchor="start">Lo0: 10.100.1.1/32</text><text x="812" y="761" class="small" text-anchor="start">Saved description:</text><text x="812" y="788" class="small" text-anchor="start">NETFLOW-EXPORT-SOURCE</text><text x="812" y="815" class="small" text-anchor="start">Exporter configuration selects Gi3.</text><text x="70" y="901" class="small" text-anchor="start">Solid lines are physical links. Cisco addressing and FNF settings come from the YAML; Alpine address comes from the handoff.</text><text x="70" y="929" class="small" text-anchor="start">NetFlow v9 and packet delivery were verified in the supplied lab evidence. This is a portfolio illustration.</text></svg>