<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">16 / Flexible NetFlow</title><desc id="desc">Four-node CML topology with three physical links. R2-SOURCE Gi0/0 connects to R1-FNF Gi1 on 10.12.12.0/30. R1 Gi2 connects to R3-DEST Gi0/0 on 10.13.13.0/30. R1 Gi3 connects to FNF-COLLECTOR eth0 on 10.30.30.0/30. R1 monitors Gi1 input and exports metadata from Gi3 10.30.30.1 to collector 10.30.30.2 UDP 2055. Collector addressing is reported interactive state absent from its saved startup script. R1 Loopback0 description is NETFLOW-EXPORT-SOURCE, but the configured export source is Gi3.</desc><style>
