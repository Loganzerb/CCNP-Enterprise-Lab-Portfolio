<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">14 / GRE over IPsec</title><desc id="desc">R1 and R3 terminate GRE and transport-mode IPsec across R2. The WAN links are 192.0.2.0/30 and 198.51.100.0/30; Tunnel0 uses 172.16.13.0/30. Private endpoints are loopbacks 10.10.10.1 and 10.30.30.1. R2 participates only in WAN transport.</desc><style>
