</style><rect class="bg" width="1200" height="1060"/><text x="48" y="59" class="heading">14 / GRE/IPsec and IKEv2 VTI</text><text x="48" y="94" class="subtitle">Two VPN implementations tested in separate stages across the same WAN</text><polyline points="200,320 200,195 1000,195 1000,320" class="link gold" stroke-dasharray="8 6"/><polyline points="200,510 200,565 550,565 550,510" class="link cyan"/><polyline points="650,510 650,565 1000,565 1000,510" class="link cyan"/><rect x="48" y="320" width="304" height="190" rx="12" class="card"/><path d="M66 321H334" class="accent gold"/><rect x="448" y="320" width="304" height="190" rx="12" class="card"/><path d="M466 321H734" class="accent cyan"/><rect x="848" y="320" width="304" height="190" rx="12" class="card"/><path d="M866 321H1134" class="accent gold"/><rect x="48" y="650" width="540" height="176" rx="10" class="note"/><rect x="612" y="650" width="540" height="176" rx="10" class="note"/><rect x="48" y="921" width="1104" height="114" rx="8" class="note"/><text x="600" y="162" class="region-title" text-anchor="middle">Logical VPN • OSPF process 10</text><rect x="439.95" y="199" width="320.1" height="29" rx="3" fill="#061e32"/><text x="600" y="221" class="label" text-anchor="middle">Logical tunnel: 172.16.13.0/30</text><rect x="81.28999999999999" y="254" width="237.42000000000002" height="28" rx="3" fill="#061e32"/><text x="200" y="275" class="port" text-anchor="middle">Tunnel0: 172.16.13.1/30</text><rect x="881.29" y="254" width="237.42000000000002" height="28" rx="3" fill="#061e32"/><text x="1000" y="275" class="port" text-anchor="middle">Tunnel0: 172.16.13.2/30</text><text x="200.0" y="356" class="device" text-anchor="middle" style="font-size:24px">R1-VPN</text><text x="200.0" y="386" class="label" text-anchor="middle">Gi0/0: 192.0.2.1/30</text><text x="200.0" y="413" class="label" text-anchor="middle">Lo0: 10.10.10.1/24</text><text x="200.0" y="440" class="label" text-anchor="middle">OSPF RID: 1.1.1.1</text><text x="600.0" y="356" class="device" text-anchor="middle" style="font-size:24px">R2-TRANSIT</text><text x="600.0" y="386" class="label" text-anchor="middle">Gi0/0: 192.0.2.2/30</text><text x="600.0" y="413" class="label" text-anchor="middle">Gi0/1: 198.51.100.1/30</text><text x="600.0" y="440" class="label" text-anchor="middle">WAN transport only</text><text x="1000.0" y="356" class="device" text-anchor="middle" style="font-size:24px">R3-VPN</text><text x="1000.0" y="386" class="label" text-anchor="middle">Gi0/0: 198.51.100.2/30</text><text x="1000.0" y="413" class="label" text-anchor="middle">Lo0: 10.30.30.1/24</text><text x="1000.0" y="440" class="label" text-anchor="middle">OSPF RID: 3.3.3.3</text><rect x="308.76" y="530" width="132.48000000000002" height="28" rx="3" fill="#061e32"/><text x="375" y="551" class="port" text-anchor="middle">192.0.2.0/30</text><rect x="744.45" y="530" width="161.1" height="28" rx="3" fill="#061e32"/><text x="825" y="551" class="port" text-anchor="middle">198.51.100.0/30</text><text x="600" y="607" class="region-title" text-anchor="middle">Physical WAN: R1 — R2 — R3</text><text x="70" y="684" class="note-heading" text-anchor="start">Stage 1 / GRE + IKEv1</text><text x="70" y="714" class="small" text-anchor="start">GRE encapsulation + ESP transport mode.</text><text x="70" y="741" class="small" text-anchor="start">Crypto ACL and WAN crypto map select/protect GRE.</text><text x="70" y="768" class="small" text-anchor="start">OSPF runs across the GRE tunnel.</text><text x="70" y="795" class="small" text-anchor="start">Captured final private ping: 20/20 replies.</text><text x="634" y="684" class="note-heading" text-anchor="start">Stage 2 / IKEv2 VTI</text><text x="634" y="714" class="small" text-anchor="start">IPsec tunnel mode; IPsec profile on Tunnel0.</text><text x="634" y="741" class="small" text-anchor="start">Routing selects Tunnel0; no site-prefix crypto ACL.</text><text x="634" y="768" class="small" text-anchor="start">OSPF runs directly over the VTI in area 0.</text><text x="634" y="795" class="small" text-anchor="start">Recorded final private ping: 10/10 replies.</text><text x="70" y="953" class="small" text-anchor="start">The designs reuse the addresses sequentially; they are not concurrent tunnels.</text><text x="70" y="981" class="small" text-anchor="start">VTI evidence combines saved configuration with the lab validation handoff.</text><text x="70" y="1009" class="small" text-anchor="start">Cyan: physical WAN links. Dashed gold: the logical VPN between R1 and R3.</text></svg>