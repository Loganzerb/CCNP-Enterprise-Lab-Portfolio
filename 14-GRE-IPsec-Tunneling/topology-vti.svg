<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">14 / GRE/IPsec and IKEv2 VTI</title><desc id="desc">Shared three-router WAN, with GRE/IKEv1 and route-based IKEv2 VTI tested separately. Both reuse Tunnel0 172.16.13.0/30. R1 and R3 terminate each VPN, while R2 routes only outer packets. VTI OSPF process 10 runs directly over Tunnel0 in area 0.</desc><style>
