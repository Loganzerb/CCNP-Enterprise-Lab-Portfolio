.link {fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.accent {stroke-width:3;fill:none}
.note {fill:#0c273c;stroke:#456276;stroke-width:1}
.note-heading {font-size:20px;font-weight:700;fill:#e5bb6d}
.region {fill:none;stroke:#63ceda;stroke-width:2;stroke-dasharray:10 8}
.region-title {font-size:24px;font-weight:700;fill:#63ceda}
.green {stroke:#74d9b0} .violet {stroke:#b7a3db}
