<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1545" role="img" aria-labelledby="title desc"><title id="title">IGMP · Receiver membership and source selection</title><desc id="desc">Focused six-node view of the inherited seven-node multicast lab, omitting the R5 BSR leaf outside the traffic path. Original links and ports are retained. R4 Gi0/0 at 10.4.4.1/24 is the receiver LAN and IGMP querier; the IOSv receiver uses Gi0/0 at 10.4.4.10/24. R4 Gi0/1 faces RP 2.2.2.2 via 10.24.0.1; Gi0/2 faces source 10.1.1.10 via 10.34.0.1. IGMPv2 membership work and the subsequent IGMPv3 stage are separate exercises. In the later stage ASM group 239.1.1.1 remains present with EXCLUDE and an empty source list. SSM group 232.1.1.1 has INCLUDE/SSM state, but displayed source-list rows are empty; a separate multicast route names source 10.1.1.10. No SSM receiver-delivery test is retained. Gold marks the ASM RP direction, green the SSM source direction, and cyan the receiver LAN. These directions interpret state rather than packet traces.</desc><style>
