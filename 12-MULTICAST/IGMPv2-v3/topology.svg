text-anchor="middle">IOSv joins on Gi0/0</text><text x="600.0" y="1335" class="label" text-anchor="middle">IGMPv2 → IGMPv3 stages</text><text x="92" y="1004" class="note-heading" text-anchor="start">ASM membership</text><text x="92" y="1034" class="small" text-anchor="start">Group · 239.1.1.1</text><text x="92" y="1061" class="small" text-anchor="start">RP · 2.2.2.2</text><text x="92" y="1088" class="small" text-anchor="start">EXCLUDE; empty source list</text><text x="842" y="1004" class="note-heading" text-anchor="start">SSM state</text><text x="842" y="1034" class="small" text-anchor="start">(10.1.1.10, 232.1.1.1)</text><text x="842" y="1061" class="small" text-anchor="start">INCLUDE / SSM membership</text><text x="842" y="1088" class="small" text-anchor="start">Source-list rows are empty</text><text x="842" y="1115" class="small" text-anchor="start">The mroute names the source</text><text x="842" y="1142" class="small" text-anchor="start">No retained delivery test</text><text x="70" y="1438" class="small" text-anchor="start">Gold: ASM RP direction · Green: SSM source direction · Cyan: receiver LAN</text><text x="70" y="1466" class="small" text-anchor="start">IGMPv2 and IGMPv3 are successive stages; ASM membership persists in the later stage.</text><text x="70" y="1494" class="small" text-anchor="start">R5 is omitted from this focused view. SSM routing state does not establish receiver delivery.</text></svg>