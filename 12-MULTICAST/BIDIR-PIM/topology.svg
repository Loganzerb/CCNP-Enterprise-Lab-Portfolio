<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">BIDIR-PIM · Two possible forwarders on one source LAN</title><desc id="desc">Dedicated BIDIR topology with corrected physical roles: source Gi0/0 and R1 Gi0/1 and R2 Gi0/0 share an unmanaged switch on 10.10.10.0/24. R1 Gi0/0 connects to R3 Gi0/0 on 10.13.0.0/30; R2 Gi0/1 connects to R3 Gi0/1 on 10.23.0.0/30; R3 Gi0/2 connects to R4 Gi0/0 on 10.34.0.0/30; R3 Gi0/3 connects to receiver Gi0/0 on 10.30.30.0/24. R4 loopback 4.4.4.4/32 is the RPA for final group selector 239.100.100.0/24 and test group 239.100.100.100. Original source-LAN DF is R1 with total RPA metric 12; R1 uplink OSPF cost changes from 10 to 50 and total metric becomes 52, while R2 stays at 32 and becomes DF. R2 is PIM DR in both captured states. Green identifies the original R1 DF branch, cyan R2’s later DF branch and receiver LAN, and gold the RPA direction. Both branches are physical wiring; role highlights combine separate observations. The later post-change test recorded 29/30 replies, not transition loss. A rollback to R1 cost 10 was proposed but not captured. R1 retained descriptions lag behind the corrected wiring; the addresses and adjacency evidence determine the actual ports.</desc><style>
