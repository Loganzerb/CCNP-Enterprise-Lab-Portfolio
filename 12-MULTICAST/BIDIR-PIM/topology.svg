 x="207.15" y="784" width="65.7" height="28" rx="3" fill="#061e32"/><text x="240" y="805" class="port" text-anchor="middle">Gi0/0</text><rect x="397.15" y="914" width="65.7" height="28" rx="3" fill="#061e32"/><text x="430" y="935" class="port" text-anchor="middle">Gi0/0</text><rect x="927.15" y="784" width="65.7" height="28" rx="3" fill="#061e32"/><text x="960" y="805" class="port" text-anchor="middle">Gi0/1</text><rect x="737.15" y="914" width="65.7" height="28" rx="3" fill="#061e32"/><text x="770" y="935" class="port" text-anchor="middle">Gi0/1</text><rect x="387.15" y="1096" width="65.7" height="28" rx="3" fill="#061e32"/><text x="420" y="1117" class="port" text-anchor="middle">Gi0/2</text><rect x="297.15" y="1137" width="65.7" height="28" rx="3" fill="#061e32"/><text x="330" y="1158" class="port" text-anchor="middle">Gi0/0</text><rect x="747.15" y="1096" width="65.7" height="28" rx="3" fill="#061e32"/><text x="780" y="1117" class="port" text-anchor="middle">Gi0/3</text><rect x="837.15" y="1137" width="65.7" height="28" rx="3" fill="#061e32"/><text x="870" y="1158" class="port" text-anchor="middle">Gi0/0</text><rect x="100.58" y="856" width="138.84" height="29" rx="3" fill="#061e32"/><text x="170" y="878" class="small" text-anchor="middle">10.13.0.0/30</text><rect x="960.58" y="856" width="138.84" height="29" rx="3" fill="#061e32"/><text x="1030" y="878" class="small" text-anchor="middle">10.23.0.0/30</text><rect x="115.58" y="1096" width="138.84" height="29" rx="3" fill="#061e32"/><text x="185" y="1118" class="small" text-anchor="middle">10.34.0.0/30</text><rect x="940.545" y="1096" width="148.91" height="29" rx="3" fill="#061e32"/><text x="1015" y="1118" class="small" text-anchor="middle">10.30.30.0/24</text><text x="600.0" y="186" class="device" text-anchor="middle" style="font-size:24px">SRC-HOST</text><text x="600.0" y="216" class="label" text-anchor="middle">10.10.10.100/24</text><text x="600.0" y="243" class="label" text-anchor="middle">IOSv endpoint · Gi0/0</text><text x="600.0" y="270" class="label" text-anchor="middle">Gateway · 10.10.10.1</text><text x="600.0" y="386" class="device" text-anchor="middle" style="font-size:24px">Unmanaged switch</text><text x="600.0" y="416" class="label" text-anchor="middle">Shared source LAN</text><text x="600.0" y="443" class="label" text-anchor="middle">10.10.10.0/24</text><text x="210.0" y="656" class="device" text-anchor="middle" style="font-size:24px">R1-DF-A</text><text x="210.0" y="686" class="label" text-anchor="middle">Source LAN · 10.10.10.1</text><text x="210.0" y="713" class="label" text-anchor="middle">Original source-LAN DF</text><text x="210.0" y="740" class="label" text-anchor="middle">Corrected LAN port · Gi0/1</text><text x="990.0" y="656" class="device" text-anchor="middle" style="font-size:24px">R2-DF-B</text><text x="990.0" y="686" class="label" text-anchor="middle">Source LAN · 10.10.10.2</text><text x="990.0" y="713" class="label" text-anchor="middle">PIM DR; later source-LAN DF</text><text x="990.0" y="740" class="label" text-anchor="middle">Source LAN port · Gi0/0</text><text x="600.0" y="986" class="device" text-anchor="middle" style="font-size:24px">R3-BRANCH</text><text x="600.0" y="1016" class="label" text-anchor="middle">Receiver branch</text><text x="600.0" y="1043" class="label" text-anchor="middle">Bidir-Upstream · Gi0/2</text><text x="600.0" y="1070" class="label" text-anchor="middle">Receiver gateway · 10.30.30.1</text><text x="230.0" y="1206" class="device" text-anchor="middle" style="font-size:24px">R4-RPA</text><text x="230.0" y="1236" class="label" text-anchor="middle">RPA · 4.4.4.4/32</text><text x="230.0" y="1263" class="label" text-anchor="middle">Lo0 supplies the RPA</text><text x="230.0" y="1290" class="label" text-anchor="middle">Gi0/0 toward R3</text><text x="970.0" y="1206" class="device" text-anchor="middle" style="font-size:24px">RCV-HOST</text><text x="970.0" y="1236" class="label" text-anchor="middle">10.30.30.100/24</text><text x="970.0" y="1263" class="label" text-anchor="middle">IOSv receiver · Gi0/0</text><text x="970.0" y="1290" class="label" text-anchor="middle">Gateway · 10.30.30.1</text><text x="452" y="614" class="note-heading" text-anchor="start">Two captured DF stages</text><text x="452" y="644" class="small" text-anchor="start">Original: R1 DF · metric 12</text><text x="452" y="671" class="small" text-anchor="start">Later: R1 metric 52; R2 · 32</text><text x="452" y="698" class="small" text-anchor="start">R2 becomes DF; remains DR</text><text x="452" y="725" class="small" text-anchor="start">R1 uplink cost · 10 → 50</text><text x="452" y="752" class="small" text-anchor="start">Rollback was not captured</text><text x="70" y="1403" class="small" text-anchor="start">Group · 239.100.100.100 · RPA · 4.4.4.4 · Final selector · 239.100.100.0/24</text><text x="70" y="1431" class="small" text-anchor="start">Green: original R1 branch · Cyan: later R2 branch / receiver LAN · Gold: RPA direction</text><text x="70" y="1459" class="small" text-anchor="start">Post-change test: 29/30 replies; transition loss was not measured. Corrected ports shown.</text></svg>