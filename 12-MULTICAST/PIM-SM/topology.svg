<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">PIM-SM · Static RP and source paths</title><desc id="desc">Six-node static-RP baseline. Source Gi0/0 at 10.1.1.10 connects to R1 Gi0/0 at 10.1.1.1; R1 Gi0/1 connects to R2 Gi0/0 on 10.12.0.0/30; R1 Gi0/2 connects to R3 Gi0/0 on 10.13.0.0/30; R2 Gi0/1 connects to R4 Gi0/1 on 10.24.0.0/30; R3 Gi0/1 connects to R4 Gi0/2 on 10.34.0.0/30; R4 Gi0/0 connects to receiver Gi0/0 on 10.4.4.0/24. R2 loopback 2.2.2.2 is the static RP. Gold highlights the R2-to-R4 shared-tree branch, green the R1-to-R3-to-R4 source-tree path, and cyan endpoint LANs. Auto-RP uses the same physical wiring in a separate later phase, with R2 Candidate RP and R3 Mapping Agent. Static device templates are reconstructed; path highlights explain retained baseline state and are not a synchronized packet trace.</desc><style>
