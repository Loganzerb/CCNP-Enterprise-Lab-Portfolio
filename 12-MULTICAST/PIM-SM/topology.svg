<text x="490" y="1128.0" class="small" text-anchor="middle">10.4.4.0/24</text><text x="600.0" y="186" class="device" text-anchor="middle" style="font-size:24px">MCAST-SOURCE</text><text x="600.0" y="216" class="label" text-anchor="middle">10.1.1.10/24</text><text x="600.0" y="243" class="label" text-anchor="middle">IOSv endpoint</text><text x="600.0" y="416" class="device" text-anchor="middle" style="font-size:24px">R1-FHR</text><text x="600.0" y="446" class="label" text-anchor="middle">Source LAN gateway</text><text x="600.0" y="473" class="label" text-anchor="middle">Gi0/0 · 10.1.1.1/24</text><text x="230.0" y="686" class="device" text-anchor="middle" style="font-size:24px">R2-RP</text><text x="230.0" y="716" class="label" text-anchor="middle">Static RP</text><text x="230.0" y="743" class="label" text-anchor="middle">Lo0 · 2.2.2.2/32</text><text x="230.0" y="770" class="label" text-anchor="middle">RP-facing branch</text><text x="970.0" y="686" class="device" text-anchor="middle" style="font-size:24px">R3-TRANSIT</text><text x="970.0" y="716" class="label" text-anchor="middle">Source-facing branch</text><text x="970.0" y="743" class="label" text-anchor="middle">R4 neighbor · 10.34.0.1</text><text x="970.0" y="770" class="label" text-anchor="middle">Native source-tree path</text><text x="600.0" y="966" class="device" text-anchor="middle" style="font-size:24px">R4-LHR</text><text x="600.0" y="996" class="label" text-anchor="middle">Receiver LAN gateway</text><text x="600.0" y="1023" class="label" text-anchor="middle">Gi0/0 · 10.4.4.1/24</text><text x="600.0" y="1050" class="label" text-anchor="middle">Gi0/1 OSPF cost · 2</text><text x="600.0" y="1216" class="device" text-anchor="middle" style="font-size:24px">MCAST-RECEIVER</text><text x="600.0" y="1246" class="label" text-anchor="middle">10.4.4.10/24</text><text x="600.0" y="1273" class="label" text-anchor="middle">IOSv endpoint</text><text x="600.0" y="1300" class="label" text-anchor="middle">Join · 239.1.1.1</text><text x="92" y="1074" class="note-heading" text-anchor="start">Later Auto-RP phase</text><text x="92" y="1104" class="small" text-anchor="start">Same six-node wiring</text><text x="92" y="1131" class="small" text-anchor="start">R2 becomes Candidate RP</text><text x="92" y="1158" class="small" text-anchor="start">R3 becomes Mapping Agent</text><text x="92" y="1185" class="small" text-anchor="start">Separate discovery settings</text><text x="842" y="1184" class="note-heading" text-anchor="start">Baseline paths at R4</text><text x="842" y="1214" class="small" text-anchor="start">RP via Gi0/1 toward R2</text><text x="842" y="1241" class="small" text-anchor="start">Source via Gi0/2 toward R3</text><text x="842" y="1268" class="small" text-anchor="start">OSPF cost 2 on Gi0/1</text><text x="70" y="1431" class="small" text-anchor="start">Gold: shared-tree branch · Green: source-tree path · Cyan: endpoint LANs</text><text x="70" y="1459" class="small" text-anchor="start">Baseline path highlights; the static configuration templates are reconstructed.</text></svg>