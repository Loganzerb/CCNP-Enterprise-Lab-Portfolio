<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1535" role="img" aria-labelledby="title desc"><title id="title">PIM-SM · BSR election and RP discovery</title><desc id="desc">The six-node PIM diamond adds only R3 Gi0/2 to R5 Gi0/0 on 10.35.0.0/30. Completed connected roles show R5 at 5.5.5.5 elected BSR, with R3 at 3.3.3.3 still Candidate BSR, both at priority 20. R5 wins the BSR address tie; this is separate from RP hashing. R2 at 2.2.2.2 is the final sole Candidate RP at RP priority 0. R3 temporary Candidate RP work belongs to a separate selection experiment. The preserved September 24 export is an intermediate checkpoint, preceding PIM repairs on R3 and R2 Candidate RP setup. Gold marks the shared-tree branch, green the source-tree path, cyan endpoint LANs, and violet the added R5 physical link. No traffic-continuity or convergence measurement is implied by the role diagram.</desc><style>
