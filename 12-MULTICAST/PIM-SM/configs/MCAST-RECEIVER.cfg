! Reconstructed static-RP baseline; not a running-config export.
! Apply in configuration mode on the corresponding fresh IOSv node.
! See README.md for scope and verification.
hostname MCAST-RECEIVER
no ip routing
!
interface GigabitEthernet0/0
 ip address 10.4.4.10 255.255.255.0
 ip igmp join-group 239.1.1.1
 no shutdown
!
ip default-gateway 10.4.4.1
end

