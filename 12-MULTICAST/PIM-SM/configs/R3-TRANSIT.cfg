! Reconstructed static-RP baseline; not a running-config export.
! Apply in configuration mode on the corresponding fresh IOSv node.
! See README.md for scope and verification.
hostname R3-TRANSIT
ip multicast-routing
ip pim rp-address 2.2.2.2
!
interface GigabitEthernet0/0
 description LINK-TO-R1-FHR
 ip address 10.13.0.2 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
interface GigabitEthernet0/1
 description LINK-TO-R4-LHR
 ip address 10.34.0.1 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 network 10.13.0.0 0.0.0.3 area 0
 network 10.34.0.0 0.0.0.3 area 0
!
end

