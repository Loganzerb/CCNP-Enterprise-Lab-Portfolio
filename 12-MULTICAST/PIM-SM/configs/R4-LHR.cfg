! Reconstructed static-RP baseline; not a running-config export.
! Apply in configuration mode on the corresponding fresh IOSv node.
! See README.md for scope and verification.
hostname R4-LHR
ip multicast-routing
ip pim rp-address 2.2.2.2
!
interface GigabitEthernet0/0
 description MCAST-RECEIVER-LAN
 ip address 10.4.4.1 255.255.255.0
 ip pim sparse-mode
 no shutdown
!
interface GigabitEthernet0/1
 description LINK-TO-R2-RP
 ip address 10.24.0.2 255.255.255.252
 ip pim sparse-mode
 ip ospf cost 2
 no shutdown
!
interface GigabitEthernet0/2
 description LINK-TO-R3-TRANSIT
 ip address 10.34.0.2 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 passive-interface GigabitEthernet0/0
 network 10.4.4.0 0.0.0.255 area 0
 network 10.24.0.0 0.0.0.3 area 0
 network 10.34.0.0 0.0.0.3 area 0
!
end

