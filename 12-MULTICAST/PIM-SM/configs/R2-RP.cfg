! Reconstructed static-RP baseline; not a running-config export.
! Apply in configuration mode on the corresponding fresh IOSv node.
! See README.md for scope and verification.
hostname R2-RP
ip multicast-routing
ip pim rp-address 2.2.2.2
!
interface GigabitEthernet0/0
 description LINK-TO-R1-FHR
 ip address 10.12.0.2 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
interface GigabitEthernet0/1
 description LINK-TO-R4-LHR
 ip address 10.24.0.1 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip pim sparse-mode
!
router ospf 1
 router-id 2.2.2.2
 network 2.2.2.2 0.0.0.0 area 0
 network 10.12.0.0 0.0.0.3 area 0
 network 10.24.0.0 0.0.0.3 area 0
!
end

