! Reconstructed static-RP baseline; not a running-config export.
! Apply in configuration mode on the corresponding fresh IOSv node.
! See README.md for scope and verification.
hostname R1-FHR
ip multicast-routing
ip pim rp-address 2.2.2.2
!
interface GigabitEthernet0/0
 description MCAST-SOURCE-LAN
 ip address 10.1.1.1 255.255.255.0
 ip pim sparse-mode
 no shutdown
!
interface GigabitEthernet0/1
 description LINK-TO-R2-RP
 ip address 10.12.0.1 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
interface GigabitEthernet0/2
 description LINK-TO-R3-TRANSIT
 ip address 10.13.0.1 255.255.255.252
 ip pim sparse-mode
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.12.0.0 0.0.0.3 area 0
 network 10.13.0.0 0.0.0.3 area 0
!
end

