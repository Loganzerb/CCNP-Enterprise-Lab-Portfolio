</text><text x="463" y="318" class="port" text-anchor="end">Gi1</text><text x="463" y="462" class="port" text-anchor="end">Gi2</text><text x="751" y="366" class="port" text-anchor="start">Gi3</text><text x="878" y="366" class="port" text-anchor="end">eth0</text><text x="815" y="327" class="small" text-anchor="middle">172.16.40.0/24</text><rect x="758" y="410" width="114" height="62" rx="7" class="note"/><text x="815" y="435" class="small" text-anchor="middle">ACL check</text><text x="815" y="459" class="small" text-anchor="middle">Gi3 OUT</text><text x="48" y="636" class="subtitle" text-anchor="start">Final attachment: USERS-TO-SERVER outbound on Gi3</text><rect x="48" y="663" width="1104" height="104" rx="10" class="note"/><text x="70" y="694" class="note-heading" text-anchor="start">FINAL POLICY</text><text x="245" y="694" class="small" text-anchor="start">Deny client TCP 22 and UDP 5300 to 172.16.40.10; permit other IPv4.</text><text x="70" y="725" class="small" text-anchor="start">TCP 443 used Netcat connection testing; no HTTPS/TLS service validation is claimed.</text><text x="70" y="750" class="small" text-anchor="start">Wiring and final attachment from the saved CML export; diagram is not a runtime capture.</text></svg>
