<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">21 / Access Control Lists</title>
<desc id="desc">Four-node, three-link ACL lab. CLIENT-A eth0 at 10.10.10.25/24 connects to R1-ACL Gi1 at 10.10.10.1. CLIENT-B eth0 at 10.20.20.25/24 connects to R1 Gi2 at 10.20.20.1. R1 Gi3 at 172.16.40.1 connects to APP-SERVER eth0 at 172.16.40.10/24. The USERS-TO-SERVER extended ACL is attached outbound on Gi3. Final rules deny client TCP destination port 22 and UDP destination port 5300 to the server, then permit other IPv4 traffic. Diagram derived from the saved CML configuration; it is not a runtime capture. TCP 443 was tested with Netcat, not HTTPS or TLS.</desc>
