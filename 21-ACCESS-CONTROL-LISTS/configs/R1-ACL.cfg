!
!
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
platform qfp utilization monitor load 80
platform punt-keepalive disable-kernel-core
platform console serial
!
hostname R1-ACL
!
boot-start-marker
boot-end-marker
!
!
no logging console
!
no aaa new-model
!
!
!
!
!
!
!
no ip domain lookup
!
!
!
login on-success log
!
!
!
!
!
!
!
subscriber templating
!
!
!
!
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
diagnostic bootup level minimal
memory free low-watermark processor 71507
!
!
spanning-tree extend system-id
!
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet1
 description TO-CLIENT-A
 ip address 10.10.10.1 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 description TO-CLIENT-B
 ip address 10.20.20.1 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 description TO-APP-SERVER
 ip address 172.16.40.1 255.255.255.0
 ip access-group USERS-TO-SERVER out
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet4
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
ip forward-protocol nd
ip http server
ip http authentication local
ip http secure-server
!
!
ip access-list extended USERS-TO-SERVER
 10 deny   tcp 10.10.10.0 0.0.0.255 host 172.16.40.10 eq 22
 20 deny   tcp 10.20.20.0 0.0.0.255 host 172.16.40.10 eq 22
 21 deny   udp 10.10.10.0 0.0.0.255 host 172.16.40.10 eq 5300
 22 deny   udp 10.20.20.0 0.0.0.255 host 172.16.40.10 eq 5300
 30 permit ip any any
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 stopbits 1
line vty 0 4
 login
 transport input ssh
!
end
