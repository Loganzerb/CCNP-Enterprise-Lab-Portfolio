    !
    interface GigabitEthernet1
     description TO-CLIENT-A
     ip address 10.10.10.1 255.255.255.0
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet2
     description TO-CLIENT-B
     ip address 10.20.20.1 255.255.255.0
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet3
     description TO-APP-SERVER
     ip address 172.16.40.1 255.255.255.0
     ip access-group USERS-TO-SERVER out
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet4
     no ip address
     shutdown
     negotiation auto
     no mop enabled
     no mop sysid
    !
    ip forward-protocol nd
    ip http server
    ip http authentication local
    ip http secure-server
    !
    !
    ip access-list extended USERS-TO-SERVER
     10 deny   tcp 10.10.10.0 0.0.0.255 host 172.16.40.10 eq 22
     20 deny   tcp 10.20.20.0 0.0.0.255 host 172.16.40.10 eq 22
     21 deny   udp 10.10.10.0 0.0.0.255 host 172.16.40.10 eq 5300
     22 deny   udp 10.20.20.0 0.0.0.255 host 172.16.40.10 eq 5300
     30 permit ip any any
    !
    !
    !
    !
    !
    !
    control-plane
    !
    !
    !
    !
    !
    !
    line con 0
     exec-timeout 0 0
     stopbits 1
    line vty 0 4
     login
     transport input ssh
    !
    end
