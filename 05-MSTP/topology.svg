<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">MSTP topology: regions, VLAN groups and preferred roots</title>
<desc id="desc">Five IOSvL2 switches connected by six physical trunks. MST1 through MST4 run MST in region CCNP_MST, revision 1. MSTI 1 maps VLANs 10 and 20 with MST1-DIST-A preferred at priority 24576; MSTI 2 maps VLANs 30 and 40 with MST4-DIST-B preferred at priority 24576. IST covers unmapped VLANs. Links are MST1 Gi0/0 to MST2 Gi0/0; MST1 Gi0/1 to MST3 Gi0/0; MST2 Gi0/1 to MST4 Gi0/0; MST3 Gi0/1 to MST4 Gi0/1; MST2 Gi0/2 to MST3 Gi0/2; MST4 Gi0/2 to external MST5 Gi0/0. MST5 runs Rapid PVST+ in the saved configuration. An earlier test used separate MST region BOUNDARY_MST with temporary MST0 priority 16384. This diagram shows wiring and configured preferences, not a synchronized forwarding snapshot.</desc>
