!
! R4-BRANCH | EIGRP AS 100
! CCNP Enterprise Lab Portfolio
! Authentication secret replaced with a nonfunctional placeholder.
!
hostname R4-BRANCH
!
key chain R4-EIGRP-KEYS
 key 2
  key-string <REDACTED-EIGRP-MD5-KEY>
!
interface Loopback0
 description BRANCH-LAN-40
 ip address 172.16.40.1 255.255.255.0
!
interface Loopback1
 description BRANCH-LAN-41
 ip address 172.16.41.1 255.255.255.0
!
interface Loopback2
 description BRANCH-LAN-42
 ip address 172.16.42.1 255.255.255.0
!
interface Loopback3
 description BRANCH-LAN-43
 ip address 172.16.43.1 255.255.255.0
!
interface GigabitEthernet0/0
 description LINK-TO-R2-DIST-A
 ip address 10.24.0.1 255.255.255.252
 ip hello-interval eigrp 100 2
 ip hold-time eigrp 100 6
 ip summary-address eigrp 100 172.16.40.0 255.255.252.0
!
interface GigabitEthernet0/1
 description LINK-TO-R3-DIST-B
 ip address 10.34.0.2 255.255.255.252
 ip summary-address eigrp 100 172.16.40.0 255.255.252.0
!
interface GigabitEthernet0/2
 description LINK-TO-R5-REMOTE
 ip address 10.45.0.1 255.255.255.252
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 R4-EIGRP-KEYS
!
router eigrp 100
 distribute-list prefix R5-DEFAULT-ONLY out GigabitEthernet0/2
 network 10.24.0.0 0.0.0.3
 network 10.34.0.0 0.0.0.3
 network 10.45.0.0 0.0.0.3
 network 172.16.40.0 0.0.3.255
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 eigrp router-id 172.16.40.1
!
ip prefix-list R5-DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
end
