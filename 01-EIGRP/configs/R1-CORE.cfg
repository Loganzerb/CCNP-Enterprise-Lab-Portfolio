!
! R1-CORE | EIGRP AS 100
! CCNP Enterprise Lab Portfolio
! Authentication secret replaced with a nonfunctional placeholder.
!
hostname R1-CORE
!
key chain EIGRP_KEYS
 key 1
  key-string <REDACTED-EIGRP-MD5-KEY>
!
interface Loopback0
 description ROUTER-ID
 ip address 10.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-R2-DIST-A
 ip address 10.12.0.1 255.255.255.252
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 EIGRP_KEYS
!
interface GigabitEthernet0/1
 description LINK-TO-R3-DIST-B
 ip address 10.13.0.1 255.255.255.252
!
interface GigabitEthernet0/3
 description OSPF-TRANSIT-TO-O1-CORE
 ip address 10.200.1.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
!
router eigrp 100
 network 10.1.1.1 0.0.0.0
 network 10.12.0.0 0.0.0.3
 network 10.13.0.0 0.0.0.3
 redistribute static metric 1000000 10 255 1 1500 route-map STATIC-TO-EIGRP
 redistribute ospf 1 metric 1000000 10 255 1 1500 route-map OSPF-TO-EIGRP
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 eigrp router-id 10.1.1.1
!
router ospf 1
 router-id 10.1.1.1
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 redistribute eigrp 100 subnets route-map EIGRP-TO-OSPF
 passive-interface default
 no passive-interface GigabitEthernet0/3
!
ip route 0.0.0.0 0.0.0.0 10.200.1.2
!
ip prefix-list REDISTRIBUTE-DEFAULT seq 5 permit 0.0.0.0/0
!
route-map STATIC-TO-EIGRP permit 10
 match ip address prefix-list REDISTRIBUTE-DEFAULT
!
route-map STATIC-TO-EIGRP deny 30
!
route-map EIGRP-TO-OSPF deny 10
 match tag 200
!
route-map EIGRP-TO-OSPF permit 20
 set metric 50
 set metric-type type-1
 set tag 100
!
route-map OSPF-TO-EIGRP deny 10
 match tag 100
!
route-map OSPF-TO-EIGRP permit 20
 set tag 200
!
end
