!
! R2-DIST-A | EIGRP AS 100
! CCNP Enterprise Lab Portfolio
! Authentication secret replaced with a nonfunctional placeholder.
!
hostname R2-DIST-A
!
key chain EIGRP_KEYS
 key 1
  key-string <REDACTED-EIGRP-MD5-KEY>
!
interface Loopback0
 description ROUTER-ID
 ip address 10.2.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-R1-CORE
 ip address 10.12.0.2 255.255.255.252
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 EIGRP_KEYS
!
interface GigabitEthernet0/1
 description LINK-TO-R3-DIST-B
 ip address 10.23.0.2 255.255.255.252
!
interface GigabitEthernet0/2
 description LINK-TO-R4-BRANCH
 ip address 10.24.0.2 255.255.255.252
!
router eigrp 100
 network 10.2.2.2 0.0.0.0
 network 10.12.0.0 0.0.0.3
 network 10.23.0.0 0.0.0.3
 network 10.24.0.0 0.0.0.3
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 eigrp router-id 10.2.2.2
!
end
