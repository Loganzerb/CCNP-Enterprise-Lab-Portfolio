!
! R5-REMOTE | Named EIGRP, AS 100
! CCNP Enterprise Lab Portfolio
! Authentication secret replaced with a nonfunctional placeholder.
!
hostname R5-REMOTE
!
key chain R5-EIGRP-KEYS
 key 2
  key-string <REDACTED-EIGRP-MD5-KEY>
!
interface Loopback0
 description REMOTE-LAN-48
 ip address 172.16.48.1 255.255.255.0
!
interface Loopback1
 description REMOTE-LAN-49
 ip address 172.16.49.1 255.255.255.0
!
interface Loopback2
 description REMOTE-LAN-50
 ip address 172.16.50.1 255.255.255.0
!
interface Loopback3
 description REMOTE-LAN-51
 ip address 172.16.51.1 255.255.255.0
!
interface GigabitEthernet0/0
 description LINK-TO-R4-BRANCH
 ip address 10.45.0.2 255.255.255.252
!
router eigrp CCNP-LAB
 address-family ipv4 unicast autonomous-system 100
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface GigabitEthernet0/0
   summary-address 172.16.48.0 255.255.252.0
   authentication mode md5
   authentication key-chain R5-EIGRP-KEYS
   no passive-interface
  exit-af-interface
  !
  topology base
  exit-af-topology
  network 10.45.0.0 0.0.0.3
  network 172.16.48.0 0.0.3.255
  eigrp router-id 172.16.48.1
  eigrp stub connected summary
 exit-address-family
!
end
