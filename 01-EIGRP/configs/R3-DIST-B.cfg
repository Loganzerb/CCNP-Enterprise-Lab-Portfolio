!
! R3-DIST-B | EIGRP AS 100
! CCNP Enterprise Lab Portfolio
!
hostname R3-DIST-B
!
interface Loopback0
 description ROUTER-ID
 ip address 10.3.3.3 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-R1-CORE
 ip address 10.13.0.2 255.255.255.252
!
interface GigabitEthernet0/1
 description LINK-TO-R2-DIST-A
 ip address 10.23.0.1 255.255.255.252
!
interface GigabitEthernet0/2
 description LINK-TO-R4-BRANCH
 ip address 10.34.0.1 255.255.255.252
!
interface GigabitEthernet0/3
 description OSPF-TRANSIT-TO-O4-EDGE
 ip address 10.200.2.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 10
!
router eigrp 100
 network 10.3.3.3 0.0.0.0
 network 10.13.0.0 0.0.0.3
 network 10.23.0.0 0.0.0.3
 network 10.34.0.0 0.0.0.3
 redistribute ospf 1 metric 1000000 10 255 1 1500 route-map OSPF-TO-EIGRP
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 eigrp router-id 10.3.3.3
!
router ospf 1
 router-id 10.3.3.3
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 area 10 nssa
 redistribute eigrp 100 subnets route-map EIGRP-TO-OSPF
 passive-interface default
 no passive-interface GigabitEthernet0/3
!
route-map EIGRP-TO-OSPF deny 10
 match tag 200
!
route-map EIGRP-TO-OSPF permit 20
 set metric 50
 set metric-type type-1
 set tag 100
!
route-map OSPF-TO-EIGRP deny 10
 match tag 100
!
route-map OSPF-TO-EIGRP permit 20
 set tag 200
!
end
