<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">22 / Control Plane Policing</title>
<desc id="desc">Four-node, three-link CML lab. CLIENT-A eth0 at 10.10.10.25/24 connects to R1-CoPP Gi1 at 10.10.10.1. R1 Gi2 at 10.1.12.1/30 connects to R2-PEER Gi1 at 10.1.12.2/30. R2 Gi2 at 172.16.40.1/24 connects to APP-TEST eth0 at 172.16.40.10/24. OSPF process 10, Area 0, runs between routers; endpoint-facing interfaces are passive. A logical R1 control-plane inset shows CP-PROTECT input, with SSH at 80000 bps and OSPF at 1000000 bps. Gold dashed arrows distinguish SSH terminating on R1 and OSPF from R2 from the blue physical transit path. The control-plane inset is not a fifth node. Illustration derived from saved configuration, not a runtime screenshot.</desc>
