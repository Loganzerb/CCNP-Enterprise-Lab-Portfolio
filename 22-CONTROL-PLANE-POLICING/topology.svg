.port {font-size:19px;fill:#c0d3df} .cyan {stroke:#63ceda} .gold {stroke:#e5bb6d}
.link {fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.logical {fill:none;stroke:#e5bb6d;stroke-width:2.5;stroke-dasharray:8 6}
