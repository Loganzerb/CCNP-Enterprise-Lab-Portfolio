</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e5bb6d" stroke-width="1.5"/></marker><marker id="dataarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63ceda" stroke-width="1.5"/></marker></defs>
<rect class="bg" width="1200" height="900"/>
<text x="48" y="58" class="heading">22 / CONTROL PLANE POLICING</text>
<text x="48" y="95" class="subtitle">Protect R1's management and routing processes; verify the routed service</text>
