<path d="M745 345V280" class="logical" marker-end="url(#arrow)"/>
<path d="M455 280V345" class="logical"/>
<rect x="320" y="140" width="480" height="140" rx="12" class="note"/>
<text x="560" y="176" class="note-heading" text-anchor="middle">R1 CONTROL PLANE</text>
<text x="560" y="211" class="label" text-anchor="middle">CP-PROTECT input</text>
<text x="560" y="247" class="label" text-anchor="middle">SSH: 80 kbps   |   OSPF: 1 Mbps</text>
<text x="180" y="180" class="small">SSH to R1</text>
<text x="767" y="316" class="small">OSPF from R2</text>
<rect x="48" y="345" width="234" height="190" rx="12" class="card"/><path d="M66 346H264" class="accent cyan"/><text x="165.0" y="383" class="device" text-anchor="middle">CLIENT-A</text><text x="165.0" y="421" class="label" text-anchor="middle">Alpine Desktop</text><text x="165.0" y="450" class="label" text-anchor="middle">10.10.10.25/24</text><text x="165.0" y="479" class="label" text-anchor="middle">GW: 10.10.10.1</text><rect x="338" y="345" width="234" height="190" rx="12" class="card"/><path d="M356 346H554" class="accent cyan"/><text x="455.0" y="383" class="device" text-anchor="middle">R1-CoPP</text><text x="455.0" y="421" class="label" text-anchor="middle">CSR1000v / 17.3.2</text><text x="455.0" y="450" class="label" text-anchor="middle">Gi1: 10.10.10.1</text><text x="455.0" y="479" class="label" text-anchor="middle">Gi2: 10.1.12.1</text><rect x="628" y="345" width="234" height="190" rx="12" class="card"/><path d="M646 346H844" class="accent cyan"/><text x="745.0" y="383" class="device" text-anchor="middle">R2-PEER</text><text x="745.0" y="421" class="label" text-anchor="middle">CSR1000v / 17.3.2</text><text x="745.0" y="450" class="label" text-anchor="middle">Gi1: 10.1.12.2</text><text x="745.0" y="479" class="label" text-anchor="middle">Gi2: 172.16.40.1</text><rect x="918" y="345" width="234" height="190" rx="12" class="card"/><path d="M936 346H1134" class="accent cyan"/><text x="1035.0" y="383" class="device" text-anchor="middle">APP-TEST</text><text x="1035.0" y="421" class="label" text-anchor="middle">Alpine Desktop</text><text x="1035.0" y="450" class="label" text-anchor="middle">172.16.40.10/24</text><text x="1035.0" y="479" class="label" text-anchor="middle">GW: 172.16.40.1</text><text x="292" y="422" class="port" text-anchor="start">eth0</text><text x="335" y="472" class="port" text-anchor="end">Gi1</text><text x="583" y="422" class="port" text-anchor="start">Gi2</text><text x="625" y="472" class="port" text-anchor="end">Gi1</text><text x="873" y="422" class="port" text-anchor="start">Gi2</text><text x="915" y="472" class="port" text-anchor="end">eth0</text><text x="165" y="570" class="small" text-anchor="middle">10.10.10.0/24</text><text x="600" y="570" class="small" text-anchor="middle">10.1.12.0/30 · OSPF 10 / Area 0</text><text x="1035" y="570" class="small" text-anchor="middle">172.16.40.0/24</text><rect x="48" y="615" width="1104" height="112" rx="10" class="note"/><text x="70" y="649" class="note-heading" text-anchor="start">TRANSIT SERVICE</text><text x="305" y="649" class="label" text-anchor="start">CLIENT-A → R1 → R2 → APP-TEST</text><text x="70" y="681" class="small" text-anchor="start">Blue links: physical wiring and routed traffic. Gold dashed arrows: traffic delivered to R1.</text><text x="70" y="708" class="small" text-anchor="start">CoPP acts at R1 control-plane input; these SSH/OSPF classes do not classify all transit traffic.</text><rect x="48" y="757" width="1104" height="112" rx="10" class="note"/><text x="70" y="791" class="note-heading" text-anchor="start">FINAL POLICY</text><text x="275" y="791" class="label" text-anchor="start">Both classes: conform transmit / exceed drop</text><text x="70" y="823" class="small" text-anchor="start">Endpoint-facing OSPF interfaces are passive. The R1 control-plane inset is not a fifth node.</text><text x="70" y="850" class="small" text-anchor="start">Saved CML configuration establishes wiring and policy; the diagram is not runtime evidence.</text></svg>
