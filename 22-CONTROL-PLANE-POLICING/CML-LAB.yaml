  title: CCNP Control Plane Policing Oct 20th
  version: 0.0.4
nodes:
- id: n0
  label: R1-CoPP
  node_definition: csr1000v
  x: -200
  y: -50
  configuration: |
    !
    !
    version 17.3
    service timestamps debug datetime msec
    service timestamps log datetime msec
    platform qfp utilization monitor load 80
    platform punt-keepalive disable-kernel-core
    platform console serial
    !
    hostname R1-CoPP
    !
    boot-start-marker
    boot-end-marker
    !
    !
    no logging console
    !
    no aaa new-model
    !
    !
    !
    !
    !
    !
    !
    no ip domain lookup
    ip domain name copp.lab
    !
    !
    !
    login on-success log
    !
    !
    !
    !
    !
    !
    !
    subscriber templating
    !
    !
    !
    !
    !
    !
    multilink bundle-name authenticated
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    diagnostic bootup level minimal
    memory free low-watermark processor 71507
    !
    !
    spanning-tree extend system-id
    !
    !
    redundancy
    !
    !
    !
    !
    !
    !
    !
    !
    class-map match-any CP-OSPF
     match access-group name COPP-OSPF
    class-map match-any CP-SSH
     match access-group name COPP-SSH
    !
    policy-map CP-PROTECT
     class CP-SSH
      police 80000 conform-action transmit  exceed-action drop
     class CP-OSPF
      police 1000000 conform-action transmit  exceed-action drop
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    interface GigabitEthernet1
     description TO-CLIENT-A
     ip address 10.10.10.1 255.255.255.0
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet2
     description TO-R2-PEER
     ip address 10.1.12.1 255.255.255.252
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet3
     no ip address
     shutdown
     negotiation auto
     no mop enabled
     no mop sysid
    !
    interface GigabitEthernet4
     no ip address
     shutdown
     negotiation auto
     no mop enabled
     no mop sysid
    !
    router ospf 10
     router-id 1.1.1.1
     passive-interface default
     no passive-interface GigabitEthernet2
     network 10.1.12.0 0.0.0.3 area 0
     network 10.10.10.0 0.0.0.255 area 0
    !
    ip forward-protocol nd
    ip http server
    ip http authentication local
    ip http secure-server
    !
    ip ssh version 2
    !
    ip access-list extended COPP-OSPF
     10 permit ospf host 10.1.12.2 any
    ip access-list extended COPP-SSH
     10 permit tcp any host 10.10.10.1 eq 22
    !
    !
    !
    !
    !
    !
    control-plane
     service-policy input CP-PROTECT
    !
    !
    !
    !
    !
    !
    line con 0
     exec-timeout 0 0
     stopbits 1
    line vty 0 4
     login local
     transport input ssh
    !
    end
