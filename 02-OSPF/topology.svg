 text-anchor="start">Broadcast baseline: O2 is DR on O1–O2; O4 is DR on O2–O4. All five links have captured FULL adjacencies.</text><text x="46.666666666666664" y="899.3333333333333" class="small" text-anchor="start">Additional configured links are outside this verified view. Routing state does not establish Internet access.</text></svg>