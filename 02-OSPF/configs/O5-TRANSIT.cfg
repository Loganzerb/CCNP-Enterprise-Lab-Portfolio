! Sanitized OSPF portfolio configuration
hostname O5-TRANSIT
!
interface Loopback0
 ip address 10.100.5.5 255.255.255.255
!
interface GigabitEthernet0/0
 description TO-O3-BRANCH
 ip address 10.100.35.2 255.255.255.252
 ip ospf network point-to-point
!
interface GigabitEthernet0/1
 description TO-O4-EDGE
 ip address 10.100.45.1 255.255.255.252
 ip ospf network point-to-point
!
router ospf 1
 router-id 10.100.5.5
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 area 10 nssa
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.100.5.5 0.0.0.0 area 10
 network 10.100.35.0 0.0.0.3 area 10
 network 10.100.45.0 0.0.0.3 area 10
!
end
