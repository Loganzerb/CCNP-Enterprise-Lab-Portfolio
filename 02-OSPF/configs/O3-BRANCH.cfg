! Sanitized OSPF portfolio configuration
hostname O3-BRANCH
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.3.3 255.255.255.255
!
interface Loopback1
 description BRANCH-LAN-32
 ip address 172.20.32.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback2
 description BRANCH-LAN-33
 ip address 172.20.33.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback3
 description BRANCH-LAN-34
 ip address 172.20.34.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback4
 description BRANCH-LAN-35
 ip address 172.20.35.1 255.255.255.0
 ip ospf network point-to-point
!
interface GigabitEthernet0/0
 description LINK-TO-O2-ABR
 ip address 10.100.23.2 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf network point-to-point
 ip ospf dead-interval 40
!
interface GigabitEthernet0/1
 description TO-O5-TRANSIT
 ip address 10.100.35.1 255.255.255.252
 ip ospf network point-to-point
!
router ospf 1
 router-id 10.100.3.3
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 area 10 nssa
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.100.3.3 0.0.0.0 area 10
 network 10.100.23.0 0.0.0.3 area 10
 network 10.100.35.0 0.0.0.3 area 10
 network 172.20.32.0 0.0.3.255 area 10
 maximum-paths 2
!
end
