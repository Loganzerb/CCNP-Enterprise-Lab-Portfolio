! Sanitized OSPF portfolio configuration
hostname O2-ABR
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O1-CORE
 ip address 10.100.12.2 255.255.255.252
!
interface GigabitEthernet0/1
 description LINK-TO-O3-BRANCH
 ip address 10.100.23.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf network point-to-point
!
interface GigabitEthernet0/2
 description LINK-TO-O4-EDGE
 ip address 10.100.24.1 255.255.255.252
!
router ospf 1
 router-id 10.100.2.2
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 area 10 nssa no-summary
 area 10 range 172.20.32.0 255.255.252.0
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.100.2.2 0.0.0.0 area 0
 network 10.100.12.0 0.0.0.3 area 0
 network 10.100.23.0 0.0.0.3 area 10
 network 10.100.24.0 0.0.0.3 area 10
!
end
