! Sanitized OSPF portfolio configuration
hostname O1-CORE
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O2-ABR
 ip address 10.100.12.1 255.255.255.252
!
interface GigabitEthernet0/1
 description OSPF-TRANSIT-TO-R1-CORE
 ip address 10.200.1.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
!
router ospf 1
 router-id 10.100.1.1
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.100.1.1 0.0.0.0 area 0
 network 10.100.12.0 0.0.0.3 area 0
!
end
