! Sanitized OSPF portfolio configuration
hostname O4-EDGE
!
interface Loopback0
 description OSPF-ROUTER-ID
 ip address 10.100.4.4 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK-TO-O2-ABR
 ip address 10.100.24.2 255.255.255.252
!
interface GigabitEthernet0/1
 description TO-O5-TRANSIT
 ip address 10.100.45.2 255.255.255.252
 ip ospf network point-to-point
!
interface GigabitEthernet0/2
 description OSPF-TRANSIT-TO-R3-DIST-B
 ip address 10.200.2.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 10
!
interface GigabitEthernet0/3
 description EBGP-TO-B2-ISP-B
 ip address 10.250.2.1 255.255.255.248
!
router ospf 1
 router-id 10.100.4.4
 no compatible rfc1583
 auto-cost reference-bandwidth 10000
 area 10 nssa
 redistribute static metric 20 metric-type 1 subnets route-map STATIC-TO-OSPF
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.100.4.4 0.0.0.0 area 10
 network 10.100.24.0 0.0.0.3 area 10
 network 10.100.45.0 0.0.0.3 area 10
 default-information originate
!
ip route 192.0.2.0 255.255.255.0 Null0
ip route 198.51.100.0 255.255.255.0 Null0
!
ip prefix-list OSPF-EXTERNALS seq 5 permit 192.0.2.0/24
ip prefix-list OSPF-EXTERNALS seq 10 permit 198.51.100.0/24
!
route-map STATIC-TO-OSPF permit 10
 match ip address prefix-list OSPF-EXTERNALS
!
route-map STATIC-TO-OSPF deny 100
!
end
