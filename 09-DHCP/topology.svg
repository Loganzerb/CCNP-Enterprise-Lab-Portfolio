<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">09 / DHCP relay</title><desc id="desc">CLIENT-A and CLIENT-B connect to DIST-SW access VLANs 10 and 20. DHCP-SRV connects on access VLAN 99. DIST-SW routes using three SVIs and relays initial DHCP requests to 10.99.99.50. Client addresses are observed leases, with CLIENT-B shown at its final .23 address.</desc><style>
