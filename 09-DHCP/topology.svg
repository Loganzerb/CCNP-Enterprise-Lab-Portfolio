</style><rect class="bg" width="1600" height="980"/><text x="48" y="59" class="heading">09 / DHCP relay</text><text x="48" y="94" class="subtitle">Two client VLANs share a server through routed switch interfaces</text><polyline points="405,290 520,290 520,400 615,400" class="link cyan"/><polyline points="405,670 520,670 520,520 615,520" class="link cyan"/><polyline points="1015,445 1210,445" class="link gold"/><rect x="65" y="205" width="340" height="175" rx="12" class="card"/><path d="M83 206H387" class="accent cyan"/><rect x="65" y="585" width="340" height="175" rx="12" class="card"/><path d="M83 586H387" class="accent cyan"/><rect x="615" y="340" width="400" height="240" rx="12" class="card"/><path d="M633 341H997" class="accent cyan"/><rect x="1210" y="350" width="325" height="210" rx="12" class="card"/><path d="M1228 351H1517" class="accent gold"/><rect x="615" y="660" width="920" height="130" rx="10" class="note"/><rect x="48" y="869" width="1504" height="86" rx="8" class="note"/><text x="235.0" y="241" class="device" text-anchor="middle" style="font-size:28px">CLIENT-A / VLAN 10</text><text x="235.0" y="271" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: DHCP client</text><text x="235.0" y="298" class="label" text-anchor="middle" style="font-size:22px">Observed lease: 10.10.10.21/24</text><text x="235.0" y="325" class="label" text-anchor="middle" style="font-size:22px">Gateway 10.10.10.1</text><text x="235.0" y="621" class="device" text-anchor="middle" style="font-size:28px">CLIENT-B / VLAN 20</text><text x="235.0" y="651" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: DHCP client</text><text x="235.0" y="678" class="label" text-anchor="middle" style="font-size:22px">Final lease: 10.10.20.23/24</text><text x="235.0" y="705" class="label" text-anchor="middle" style="font-size:22px">Gateway 10.10.20.1</text><text x="815.0" y="376" class="device" text-anchor="middle" style="font-size:28px">DIST-SW / routing and relay</text><text x="815.0" y="406" class="label" text-anchor="middle" style="font-size:22px">Vlan10: 10.10.10.1/24</text><text x="815.0" y="433" class="label" text-anchor="middle" style="font-size:22px">Vlan20: 10.10.20.1/24</text><text x="815.0" y="460" class="label" text-anchor="middle" style="font-size:22px">Vlan99: 10.99.99.1/24</text><text x="815.0" y="487" class="label" text-anchor="middle" style="font-size:22px">Helpers on Vlan10 and Vlan20</text><text x="815.0" y="514" class="label" text-anchor="middle" style="font-size:22px">Relay target: 10.99.99.50</text><text x="1372.5" y="386" class="device" text-anchor="middle" style="font-size:28px">DHCP-SRV / VLAN 99</text><text x="1372.5" y="416" class="label" text-anchor="middle" style="font-size:22px">Gi0/0: 10.99.99.50/24</text><text x="1372.5" y="443" class="label" text-anchor="middle" style="font-size:22px">Default via 10.99.99.1</text><text x="1372.5" y="470" class="label" text-anchor="middle" style="font-size:22px">USERS-A: 10.10.10.0/24</text><text x="1372.5" y="497" class="label" text-anchor="middle" style="font-size:22px">USERS-B: 10.10.20.0/24</text><text x="480" y="250" class="port" text-anchor="middle" style="font-size:22px">10.10.10.0/24</text><text x="425" y="322" class="port" text-anchor="start" style="font-size:22px">Client Gi0/0</text><rect x="488.72" y="354" width="111.28" height="32" rx="3" fill="#061e32"/><text x="600" y="379" class="port" text-anchor="end" style="font-size:22px">SW Gi0/0</text><text x="480" y="708" class="port" text-anchor="middle" style="font-size:22px">10.10.20.0/24</text><text x="425" y="649" class="port" text-anchor="start" style="font-size:22px">Client Gi0/0</text><rect x="488.72" y="532" width="111.28" height="32" rx="3" fill="#061e32"/><text x="600" y="557" class="port" text-anchor="end" style="font-size:22px">SW Gi0/1</text><rect x="1027.21" y="371" width="169.58" height="32" rx="3" fill="#061e32"/><text x="1112" y="396" class="port" text-anchor="middle" style="font-size:22px">10.99.99.0/24</text><text x="1035" y="476" class="port" text-anchor="start" style="font-size:22px">SW Gi0/2</text><text x="1190" y="503" class="port" text-anchor="end" style="font-size:22px">Server Gi0/0</text><text x="637" y="694" class="note-heading" text-anchor="start" style="font-size:22px">REQUEST PATH / initial acquisition</text><text x="637" y="724" class="small" text-anchor="start" style="font-size:22px">Client broadcast → local SVI relay → 10.99.99.50</text><text x="637" y="751" class="small" text-anchor="start" style="font-size:22px">Relay address selects the client pool; the server returns through 10.99.99.1.</text><text x="70" y="901" class="small" text-anchor="start" style="font-size:22px">Three physical access links; no trunks or port-channels. Configurations are reconstructed working commands.</text><text x="70" y="929" class="small" text-anchor="start" style="font-size:22px">Final CLIENT-B capture: Bound at .23 and 5/5 replies from the DHCP server. DNS/Internet access was not tested.</text></svg>