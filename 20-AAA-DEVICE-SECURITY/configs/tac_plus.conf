accounting file = /var/log/tac_plus.acct

group = NETADMINS {
    default service = permit
    service = exec {
        priv-lvl = 15
    }
}

# This default-permit lab policy blocks configure only; it is not read-only.
group = NOC-RESTRICTED {
    default service = permit
    service = exec {
        priv-lvl = 15
    }
    cmd = configure {
        deny .*
    }
}

