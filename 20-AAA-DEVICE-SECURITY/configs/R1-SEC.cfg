!
!
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
platform qfp utilization monitor load 80
platform punt-keepalive disable-kernel-core
platform console serial
!
hostname R1-SEC
!
boot-start-marker
boot-end-marker
!
!
no logging console
!
aaa new-model
!
!
aaa group server tacacs+ ADMIN-SERVERS
 server name TAC1
!
aaa authentication login default local
aaa authentication login TAC-LOGIN group ADMIN-SERVERS local
aaa authorization exec default local
aaa authorization exec TAC-EXEC group ADMIN-SERVERS local
aaa authorization commands 15 TAC-CMDS group ADMIN-SERVERS local
aaa accounting exec TAC-EXEC-ACCT start-stop group ADMIN-SERVERS
aaa accounting commands 15 TAC-CMD-ACCT start-stop group ADMIN-SERVERS
!
!
!
!
!
!
aaa session-id common
!
!
!
!
!
!
!
ip domain name encor.lab
!
!
!
login on-success log
!
!
!
!
!
!
!
subscriber templating
!
!
!
!
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
diagnostic bootup level minimal
memory free low-watermark processor 71507
!
!
spanning-tree extend system-id
!
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet1
 description TO-AAA-SERVER
 ip address 192.0.2.10 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet4
 no ip address
 shutdown
 negotiation auto
 no mop enabled
 no mop sysid
!
ip forward-protocol nd
ip http server
ip http authentication local
ip http secure-server
!
ip tacacs source-interface GigabitEthernet1
ip ssh version 2
!
!
!
!
!
tacacs server TAC1
 address ipv4 192.0.2.20
!
!
!
!
control-plane
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 stopbits 1
line vty 0 4
 authorization commands 15 TAC-CMDS
 authorization exec TAC-EXEC
 accounting commands 15 TAC-CMD-ACCT
 accounting exec TAC-EXEC-ACCT
 login authentication TAC-LOGIN
 transport input ssh
line vty 5 156
 transport input ssh
!
end
