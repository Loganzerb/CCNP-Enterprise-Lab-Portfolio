</style><rect class="bg" width="1200" height="760"/><text x="48" y="59" class="heading">20 / AAA · DEVICE SECURITY</text><text x="48" y="94" class="subtitle">Preserve the CML wiring and distinguish exported labels from guest names</text><polyline points="318,295 460,295" class="link muted"/><polyline points="740,295 882,295" class="link cyan"/><rect x="48" y="185" width="270" height="225" rx="12" class="card"/><path d="M66 186H300" class="accent cyan"/><rect x="460" y="165" width="280" height="245" rx="12" class="card"/><path d="M478 166H722" class="accent gold"/><rect x="882" y="185" width="270" height="225" rx="12" class="card"/><path d="M900 186H1134" class="accent cyan"/><rect x="48" y="470" width="540" height="155" rx="10" class="note"/><rect x="612" y="470" width="540" height="155" rx="10" class="note"/><rect x="48" y="649" width="1104" height="86" rx="8" class="note"/><text x="183.0" y="221" class="device" text-anchor="middle" style="font-size:24px">Connector NAT</text><text x="183.0" y="251" class="label" text-anchor="middle">CML external connector</text><text x="183.0" y="278" class="label" text-anchor="middle">virbr0</text><text x="183.0" y="305" class="label" text-anchor="middle">DHCP: 192.168.255.0/24</text><text x="183.0" y="332" class="label" text-anchor="middle">Gateway: 192.168.255.1</text><text x="600.0" y="201" class="device" text-anchor="middle" style="font-size:24px">AAA-SERVER</text><text x="600.0" y="231" class="label" text-anchor="middle">Ubuntu 20.04.2 LTS</text><text x="600.0" y="258" class="label" text-anchor="middle">tac_plus F4.0.4.32</text><text x="600.0" y="285" class="label" text-anchor="middle">Internal: 192.0.2.20/24</text><text x="600.0" y="312" class="label" text-anchor="middle">TACACS+ listener / TCP 49</text><text x="1017.0" y="221" class="device" text-anchor="middle" style="font-size:24px">R1-SEC</text><text x="1017.0" y="251" class="label" text-anchor="middle">CSR1000v / IOS XE 17.3.2</text><text x="1017.0" y="278" class="label" text-anchor="middle">Gi1: 192.0.2.10/24</text><text x="1017.0" y="305" class="label" text-anchor="middle">TACACS+ source: Gi1</text><text x="1017.0" y="332" class="label" text-anchor="middle">VTY 0–4: named TACACS+</text><text x="1017.0" y="359" class="label" text-anchor="middle">VTY 5–156: local defaults</text><text x="389" y="262" class="port" text-anchor="middle" style="font-size:17px">192.168.255.0/24</text><text x="811" y="262" class="port" text-anchor="middle" style="font-size:18px">192.0.2.0/24</text><text x="331" y="327" class="port" text-anchor="start">port</text><text x="446" y="355" class="port" text-anchor="end">ens3</text><text x="753" y="327" class="port" text-anchor="start">ens4</text><text x="868" y="355" class="port" text-anchor="end">Gi1</text><text x="600" y="443" class="small" text-anchor="middle">Wire labels above follow the original CML export.</text><text x="70" y="504" class="note-heading" text-anchor="start">EXPORTED CML LABELS</text><text x="70" y="534" class="small" text-anchor="start">NAT side: Ubuntu n2/i0 = ens3</text><text x="70" y="561" class="small" text-anchor="start">Internal side: Ubuntu n2/i1 = ens4</text><text x="70" y="588" class="small" text-anchor="start">Original links and interface IDs remain unchanged.</text><text x="634" y="504" class="note-heading" text-anchor="start">GUEST-OBSERVED NAMES</text><text x="634" y="534" class="small" text-anchor="start">NAT: ens2 / DHCP / gateway 192.168.255.1</text><text x="634" y="561" class="small" text-anchor="start">Internal: ens3 / 192.0.2.20/24</text><text x="634" y="588" class="small" text-anchor="start">Inspect guest mapping before applying Netplan.</text><text x="70" y="681" class="small" text-anchor="start">Ubuntu runtime software and configuration files require separate setup; they are absent from the CML export.</text><text x="70" y="709" class="small" text-anchor="start">Original Ubuntu reboot succeeded; sanitized import/run remains pending. No router reboot test is claimed.</text></svg>