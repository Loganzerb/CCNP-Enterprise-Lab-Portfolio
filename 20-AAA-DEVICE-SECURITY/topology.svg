<svg width="1200" height="760" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">20 / AAA · DEVICE SECURITY</title><desc id="desc">Three-node, two-link AAA topology. Connector NAT n0 port i0 on virbr0 connects to AAA-SERVER n2 interface i0, exported as ens3. Server interface i1, exported as ens4, connects to R1-SEC n1 GigabitEthernet1 i1 at 192.0.2.10/24. The Ubuntu guest observed its NAT interface as ens2 and internal interface as ens3 at 192.0.2.20/24. The source labels and links remain unchanged. Ubuntu provides Shrubbery tac_plus F4.0.4.32 on TCP 49. R1 uses CSR1000v IOS XE 17.3.2. Named TACACS method lists are configured on VTY 0 through 4; VTY 5 through 156 retain local defaults. Session VTY slots are not recorded. Ubuntu runtime software and files are separate from CML startup configuration. Original Ubuntu reboot results do not establish a fresh sanitized import or a router reboot test.</desc><style>
