.4705882352941" y="448.9411764705883" class="label" text-anchor="middle">Access B · Po30: auto</text><text x="956.4705882352941" y="468.00000000000006" class="label" text-anchor="middle">Vlan10 target: 10.10.10.20/24</text><text x="600.0" y="155.29411764705884" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Po10 · Static (on / on)</text><text x="451.764705882353" y="208.23529411764707" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW1 Gi0/0–1</text><text x="748.2352941176471" y="208.23529411764707" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW2 Gi0/0–1</text><text x="335.29411764705884" y="256.2352941176471" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW1 Gi0/2–3</text><text x="335.29411764705884" y="310.5882352941177" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Po20 · LACP</text><text x="335.29411764705884" y="330.3529411764706" class="small" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">active / passive</text><text x="335.29411764705884" y="377.64705882352945" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW3 Gi0/0–1</text><text x="1065.8823529411766" y="256.2352941176471" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW2 Gi0/2–3</text><text x="1065.8823529411766" y="310.5882352941177" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Po30 · PAgP</text><text x="1065.8823529411766" y="330.3529411764706" class="small" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">desirable / auto</text><text x="1065.8823529411766" y="377.64705882352945" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW4 Gi0/0–1</text><text x="600.0" y="435.5294117647059" class="label" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">Direct 802.1Q trunk</text><text x="451.764705882353" y="480.00000000000006" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW3 Gi0/2</text><text x="748.2352941176471" y="480.00000000000006" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW4 Gi0/2</text><text x="467.29411764705884" y="285.1764705882353" class="note-heading" text-anchor="start">Forwarding is per VLAN</text><text x="467.29411764705884" y="306.3529411764706" class="small" text-anchor="start">SW2 Po30: Alternate/Blocked</text><text x="467.29411764705884" y="325.4117647058824" class="small" text-anchor="start">for all five carried VLANs</text><text x="467.29411764705884" y="344.47058823529414" class="small" text-anchor="start">Membership does not prove forwarding</text><text x="243.52941176470588" y="618.3529411764706" class="device" text-anchor="middle" style="font-size:24px">PC-A</text><text x="243.52941176470588" y="639.529411764706" class="label" text-anchor="middle">10.10.10.10/24 · eth0</text><text x="243.52941176470588" y="658.5882352941177" class="label" text-anchor="middle">Access VLAN 10</text><text x="360.0" y="559.0588235294118" class="port" text-anchor="middle" style=";paint-order:stroke;stroke:#061e32;stroke-width:5px;stroke-linejoin:round">SW3 Gi0/3 ↔ PC-A eth0</text><text x="474.3529411764706" y="613.4117647058824" class="note-heading" text-anchor="start">Final exported deployment</text><text x="474.3529411764706" y="634.5882352941177" class="small" text-anchor="start">PC-B is absent from the export; tests target SW4’s Vlan10 SVI.</text><text x="474.3529411764706" y="653.6470588235295" class="small" text-anchor="start">Infrastructure trunk VLANs: 1,10,20,30,99 · Native VLAN 99</text><text x="474.3529411764706" y="672.7058823529412" class="small" text-anchor="start">Saved switch mode: classic PVST</text><text x="49.411764705882355" y="791.2941176470589" class="small" text-anchor="start">Saved wiring and settings shown; links do not denote simultaneous forwarding on every bundle.</text><text x="49.411764705882355" y="811.0588235294118" class="small" text-anchor="start">Final PC-A test: 10/10 replies from SW4 Vlan10. These probes do not measure throughput or convergence.</text></svg>